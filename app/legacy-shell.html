        <div class="hw-nav"><button class="hw-btn" type="button" id="hwPrev" aria-label="Previous step"><i class="ri-arrow-left-line" aria-hidden="true"></i></button><button class="hw-btn dark" type="button" id="hwNext" aria-label="Next step"><i class="ri-arrow-right-line" aria-hidden="true"></i></button></div>

    <div class="hw-viewport">
      <ol class="hw-track" id="hwTrack" tabindex="0" aria-label="Five design stages">
        <li class="hw-card" data-i="0" style="--k:0">
            <div class="hw-top"><h3>Understand</h3><p>I start by talking to users and stakeholders to learn the goals, the limits and where the current flow breaks.</p></div>
            <span class="hw-ico" aria-hidden="true"><i class="ri-chat-3-line" aria-hidden="true"></i></span>
          </li>
          <li class="hw-card" data-i="1" style="--k:1">
            <div class="hw-top"><h3>Structure</h3><p>I map the information, roles and user flows before any screen, so the product has a clear shape.</p></div>
            <span class="hw-ico" aria-hidden="true"><i class="ri-store-2-line" aria-hidden="true"></i></span>
          </li>
          <li class="hw-card" data-i="2" style="--k:2">
            <div class="hw-top"><h3>Design</h3><p>Wireframes first, then interaction and high-fidelity UI built on a shared design system.</p></div>
            <span class="hw-ico" aria-hidden="true"><i class="ri-layout-grid-line" aria-hidden="true"></i></span>
          </li>
          <li class="hw-card" data-i="3" style="--k:3">
            <div class="hw-top"><h3>Validate</h3><p>I test with real users, check the analytics and iterate. Most products get a second version.</p></div>
            <span class="hw-ico" aria-hidden="true"><i class="ri-bar-chart-box-line" aria-hidden="true"></i></span>
          </li>
          <li class="hw-card hw-last" data-i="4" style="--k:4">
            <div class="hw-top"><h3>Ship</h3><p>Prototypes, specs and every state documented, then I stay close to the developers through handoff and QA.</p></div>
            <span class="hw-ico" aria-hidden="true"><i class="ri-check-line" aria-hidden="true"></i></span>
          </li>

        <h2 class="h2" id="about-title">Hi, I'm Tareq. I make complicated things look easy.</h2>
        <p class="ab-lead">It's harder than it looks. That's kind of the point.</p>
        <p>I'm a Product Designer in Dhaka. For 3+ years I've designed ecommerce, logistics, ERP, payments and multi-service products for customers, merchants, operators, and the internal teams who have to stare at the admin panel all day. I try to be nice to those people.</p>
        <p>I basically live in Figma: research, user flows, design systems, prototypes and developer handoff. I've named more layers "Frame 2847 copy" than I'd like to admit, and I stick around long enough to design version two.</p>
