<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tareq Mahmud</title>
<meta name="description" content="Tareq Mahmud, Mid-Senior UI/UX and Product Designer in Dhaka. Product design for ecommerce, logistics, ERP, payments and SaaS.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* ============ Tokens (carried over from the Soniq system) ============ */
:root{
  color-scheme: light;
  --ink:#14160e;        /* olive near-black: dark sections */
  --ink-2:#1d2016;      /* dark card */
  --ink-3:#282c20;      /* dark card, raised */
  --paper:#f4f4ee;      /* cream ground */
  --paper-2:#e7e9da;    /* sage panel */
  --card:#fbfbf7;       /* light card */
  --text:#15170f;
  --muted:#65685b;
  --muted-d:#a2a596;    /* muted text on dark */
  --line:rgba(21,23,15,.12);
  --line-d:rgba(244,244,238,.13);
  --lime:#b9e25b;
  --lime-2:#a6d23f;
  --lime-ink:#18200a;

  --f-sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono:"Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --t-hero:clamp(2.55rem, 1.1rem + 5.4vw, 5.9rem);
  --t-h2:clamp(2rem, 1.25rem + 2.5vw, 3.35rem);
  --t-h3:clamp(1.3rem, 1.1rem + .7vw, 1.7rem);
  --t-lead:clamp(1.12rem, .98rem + .55vw, 1.42rem);
  --t-body:1rem;
  --t-small:.875rem;
  --t-meta:.72rem;

  --r-lg:16px; --r-md:12px; --r-pill:999px;
  --gutter:clamp(16px, 4.2vw, 56px);
  --max:1320px;
  --col-gap:clamp(16px, 2vw, 28px);
  --sec:clamp(72px, 9vw, 140px);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--f-sans);font-size:var(--t-body);line-height:1.6;font-weight:400;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:400;text-wrap:balance}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--lime-2);outline-offset:3px;border-radius:6px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;left:16px;top:-60px;z-index:100;background:var(--lime);color:var(--lime-ink);padding:10px 16px;border-radius:var(--r-pill);text-decoration:none;font-weight:500}
.skip:focus{top:calc(12px + env(safe-area-inset-top,0px))}

.wrap{max-width:var(--max);margin-inline:auto;padding-inline:var(--gutter)}
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--col-gap)}
.dark{background:var(--ink);color:var(--paper)}
.meta{font-family:var(--f-mono);font-size:var(--t-meta);letter-spacing:.07em;text-transform:uppercase}
.muted{color:var(--muted)}
.dark .muted{color:var(--muted-d)}
.h2{font-size:var(--t-h2);line-height:1.07;letter-spacing:-.032em}
.h3{font-size:var(--t-h3);line-height:1.2;letter-spacing:-.02em}
.lead{font-size:var(--t-lead);line-height:1.45;letter-spacing:-.012em}
.tnum{font-variant-numeric:tabular-nums}

/* ============ Buttons (Soniq pills) ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55em;height:48px;padding-inline:24px;border-radius:var(--r-pill);border:1px solid transparent;text-decoration:none;font-size:.95rem;font-weight:500;letter-spacing:-.005em;cursor:pointer;white-space:nowrap;transition:transform .25s var(--ease), background-color .25s, color .25s, border-color .25s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-lime{background:var(--lime);color:var(--lime-ink)}
.btn-lime:hover{background:#c7ec6e}
.btn-ink{background:var(--ink);color:var(--paper)}
.btn-ink:hover{background:#262a1d}
.btn-white{background:#fff;color:var(--ink)}
.btn-ghost{background:rgba(244,244,238,.08);color:var(--paper);border-color:var(--line-d);backdrop-filter:blur(10px)}
.btn-ghost:hover{background:rgba(244,244,238,.16)}
.btn-line{background:transparent;color:var(--text);border-color:var(--line)}
.btn-line:hover{border-color:var(--text)}
.btn svg{width:16px;height:16px;flex:none}
.arrow-link{display:inline-flex;align-items:center;gap:.45em;text-decoration:none;font-weight:500;font-size:.95rem}
.arrow-link svg{width:16px;height:16px;transition:transform .25s var(--ease)}
.arrow-link:hover svg{transform:translateX(3px)}

/* ============ Nav (Soniq frosted pill, compresses on scroll) ============ */
.nav{position:fixed;left:0;right:0;top:0;z-index:50;padding-top:calc(18px + env(safe-area-inset-top,0px));transition:padding .35s var(--ease);pointer-events:none}
.nav-bar{pointer-events:auto;max-width:1000px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 7px 7px 16px;border-radius:var(--r-pill);background:rgba(28,31,22,.55);border:1px solid rgba(244,244,238,.1);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);color:var(--paper);transition:background-color .35s, box-shadow .35s, max-width .35s var(--ease)}
.nav-wrap{padding-inline:var(--gutter)}
.nav.compact{padding-top:calc(10px + env(safe-area-inset-top,0px))}
.nav.compact .nav-bar{background:rgba(20,22,14,.86);box-shadow:0 8px 30px rgba(10,12,6,.18);max-width:920px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:500;letter-spacing:-.01em;white-space:nowrap}
.brand-dot{width:22px;height:22px;border-radius:50%;background:var(--lime);position:relative;flex:none}
.brand-dot::after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:var(--ink);left:5px;top:4px}
.nav-links{display:flex;gap:4px}
.nav-links a{padding:8px 14px;border-radius:var(--r-pill);text-decoration:none;font-size:.9rem;color:rgba(244,244,238,.82);transition:background-color .2s,color .2s}
.nav-links a:hover,.nav-links a[aria-current="true"]{background:rgba(244,244,238,.1);color:var(--paper)}
.nav-cta{display:flex;align-items:center;gap:6px}
.nav .btn{height:40px;padding-inline:18px;font-size:.88rem}
.menu-btn{display:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line-d);background:transparent;cursor:pointer;align-items:center;justify-content:center}
.menu-btn span{display:block;width:16px;height:1.5px;background:var(--paper);position:relative}
.menu-btn span::before,.menu-btn span::after{content:"";position:absolute;left:0;width:16px;height:1.5px;background:var(--paper);transition:transform .25s}
.menu-btn span::before{top:-5px}.menu-btn span::after{top:5px}
.menu-open .menu-btn span{background:transparent}
.menu-open .menu-btn span::before{transform:translateY(5px) rotate(45deg)}
.menu-open .menu-btn span::after{transform:translateY(-5px) rotate(-45deg)}
.sheet{display:none}

/* ============ Hero ============ */
.hero{position:relative;background:var(--ink);color:var(--paper);overflow:hidden;isolation:isolate}
.hero-media{position:absolute;inset:0;z-index:-2;overflow:hidden;background:radial-gradient(80% 70% at 68% 105%, #2c3316 0%, #151809 45%, #050604 80%)}
.hero-media video{position:absolute;left:0;top:-8%;width:100%;height:116%;object-fit:cover;object-position:22% center;display:block}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:
  linear-gradient(180deg, rgba(10,12,6,.35) 0%, rgba(10,12,6,0) 30%, rgba(20,22,14,0) 62%, rgba(20,22,14,.75) 88%, var(--ink) 100%),
  linear-gradient(90deg, rgba(10,12,6,.78) 0%, rgba(10,12,6,.55) 36%, rgba(10,12,6,.12) 62%, rgba(10,12,6,0) 80%)}
.media-toggle{position:absolute;right:var(--gutter);top:calc(96px + env(safe-area-inset-top,0px));z-index:2;display:inline-flex;align-items:center;gap:8px;height:32px;padding-inline:12px;border-radius:var(--r-pill);border:1px solid var(--line-d);background:rgba(20,22,14,.5);color:rgba(244,244,238,.75);font-family:var(--f-mono);font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(8px)}
.media-toggle:hover{color:var(--paper);border-color:rgba(244,244,238,.3)}
.media-toggle svg{width:10px;height:10px}
@media (max-width:860px){
  .hero::before{background:
    linear-gradient(180deg, rgba(10,12,6,.6) 0%, rgba(10,12,6,.62) 45%, rgba(20,22,14,.9) 72%, var(--ink) 100%)}
  .media-toggle{top:calc(84px + env(safe-area-inset-top,0px));height:28px;padding-inline:10px}
}
.hero-inner{padding-top:calc(150px + env(safe-area-inset-top,0px));padding-bottom:clamp(40px,6vw,72px)}
.hero-eyebrow{display:flex;align-items:center;gap:10px;color:var(--muted-d);margin-bottom:28px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px rgba(185,226,91,.18)}
.hero h1{font-size:var(--t-hero);line-height:1.01;letter-spacing:-.045em;font-weight:400;max-width:17ch}
.hero h1 em{font-style:normal;color:var(--lime)}
.hero-sub{margin-top:28px;max-width:40ch;color:rgba(244,244,238,.72)}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:36px}
.cred{margin-top:clamp(56px,7vw,96px);border-top:1px solid var(--line-d);display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.cred li{padding:20px 20px 4px 0;display:flex;flex-direction:column;gap:6px}
.cred li + li{padding-left:20px;border-left:1px solid var(--line-d)}
.cred b{font-weight:400;font-size:1.05rem;letter-spacing:-.01em}
.cred span{color:var(--muted-d);font-size:var(--t-small)}

/* Product strip (was the Soniq logo marquee) */
.strip{border-top:1px solid var(--line-d);padding-block:26px;overflow:hidden;position:relative}
.strip-label{color:var(--muted-d);margin-bottom:16px}
.marquee{display:flex;align-items:center;width:max-content;animation:marq 60s linear infinite}
.strip:hover .marquee{animation-play-state:paused}
.marquee .logo{flex:none;display:flex;align-items:center;justify-content:center;height:56px;padding-inline:clamp(28px,3.4vw,48px)}
.marquee .logo img{width:auto;max-width:none;opacity:.62;filter:saturate(.75);transition:opacity .3s, filter .3s}
.marquee .logo:hover img{opacity:1;filter:none}
@media (max-width:560px){.marquee .logo{height:44px;padding-inline:22px}.marquee .logo img{transform:scale(.8)}}
.strip::before,.strip::after{content:"";position:absolute;top:0;bottom:0;width:80px;z-index:1;pointer-events:none}
.strip::before{left:0;background:linear-gradient(90deg,var(--ink),transparent)}
.strip::after{right:0;background:linear-gradient(-90deg,var(--ink),transparent)}
@keyframes marq{to{transform:translateX(-25%)}}

/* ============ Intro statement + cards (Soniq stat row, made honest) ============ */
.intro{padding-block:clamp(64px,8vw,120px) clamp(56px,7vw,100px)}
.statement{font-size:clamp(1.55rem,1.05rem + 1.9vw,2.6rem);line-height:1.18;letter-spacing:-.028em;max-width:30ch}
.statement span{color:var(--muted-d)}
.facts{margin-top:clamp(48px,6vw,80px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.fact{border-radius:20px;padding:28px;min-height:340px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;background:var(--ink-2)}
.fact.light{background:var(--paper);color:var(--text)}
.fact.photo{position:relative;overflow:hidden;isolation:isolate;justify-content:flex-end;color:#fff}
.fact.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 18%;z-index:-2;transition:transform 1.2s var(--ease)}
.fact.photo:hover img{transform:scale(1.04)}
.fact.photo::after{content:"";position:absolute;inset:0;z-index:-1;background:none}
.fav{display:flex;align-items:center}
.fav span{width:52px;height:52px;border-radius:50%;background:var(--ink);border:3px solid var(--paper);display:grid;place-items:center;overflow:hidden;margin-left:-12px}
.fav span:first-child{margin-left:0}
.fav img{width:58%;height:58%;object-fit:contain}
.fav i{font-style:normal;width:52px;height:52px;font-size:1.5rem!important;border-width:3px!important;border-radius:50%;background:var(--lime);color:var(--lime-ink)!important;color:var(--paper);display:grid;place-items:center;margin-left:-12px;border:3px solid var(--paper)}
.fact.light .v{font-size:1.3rem;letter-spacing:-.02em;margin-bottom:12px}
.fact.light .k{font-size:.95rem;line-height:1.45}
.fl{display:flex;align-items:center;gap:10px;font-size:1.05rem;color:var(--paper)}
.fdot{width:22px;height:22px;border-radius:50%;background:var(--lime);position:relative;flex:none}
.fdot::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--ink);left:5px;top:4px}
.fact .v{font-size:clamp(3rem,2rem + 3vw,4.6rem)}
.fc{color:var(--muted-d);font-size:.9rem;margin-top:10px}
.fact.photo{padding:0}
.fact .k{font-size:var(--t-small);color:var(--muted-d)}
.fact.light .k{color:var(--muted)}
.fact .v{font-size:clamp(2.2rem,1.6rem + 1.8vw,3.4rem);line-height:1;letter-spacing:-.04em}
.fact.light .v{font-size:1.2rem;letter-spacing:-.015em;line-height:1.3}
.fact .dot{width:22px;height:22px;border-radius:50%;background:var(--ink);position:relative}
.fact .dot::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--lime)}

/* ============ Section header pattern (Soniq: title left, caption right) ============ */
.sec{padding-block:var(--sec)}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:32px 48px;flex-wrap:wrap;margin-bottom:clamp(40px,5vw,64px)}
.sec-head .h2{max-width:16ch}
.sec-head p{max-width:34ch;color:var(--muted);font-size:.95rem}
.dark .sec-head p{color:var(--muted-d)}
.eyebrow{display:block;margin-bottom:18px;color:var(--muted)}
.dark .eyebrow{color:var(--muted-d)}

/* ============ Featured work ============ */
.featured{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.feat{position:relative;border-radius:var(--r-lg);overflow:hidden;text-decoration:none;color:inherit;display:grid;isolation:isolate}
.feat.wide{grid-column:1 / -1;grid-template-columns:minmax(0,5fr) minmax(0,7fr);min-height:560px}
.feat.half{grid-template-rows:auto 1fr}
.feat.sage{background:var(--paper-2)}
.feat.inkc{background:var(--ink);color:var(--paper)}
.feat.limec{background:var(--lime);color:var(--lime-ink)}
.feat.cardc{background:var(--card);border:1px solid var(--line)}
.feat-body{padding:clamp(24px,3vw,44px);display:flex;flex-direction:column;gap:18px;justify-content:space-between;position:relative;z-index:1}
.feat-top{display:flex;flex-direction:column;gap:16px}
.feat-index{display:flex;justify-content:space-between;gap:12px;opacity:.7}
.feat h3{font-size:clamp(1.7rem,1.25rem + 1.5vw,2.6rem);line-height:1.05;letter-spacing:-.035em}
.feat .cat{opacity:.75}
.feat p.desc{max-width:40ch;opacity:.82}
.feat-meta{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:var(--t-small);border-top:1px solid currentColor;border-color:color-mix(in srgb, currentColor 16%, transparent);padding-top:16px}
.feat-meta dt{opacity:.6}
.feat-meta dd{margin:0}
.feat-cta{display:inline-flex;align-items:center;gap:10px;font-weight:500}
.feat-cta i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:currentColor;transition:transform .35s var(--ease)}
.feat-cta i svg{width:16px;height:16px}
.feat.sage .feat-cta i svg,.feat.cardc .feat-cta i svg{color:var(--paper)}
.feat.inkc .feat-cta i{background:var(--lime)} .feat.inkc .feat-cta i svg{color:var(--lime-ink)}
.feat.limec .feat-cta i{background:var(--lime-ink)} .feat.limec .feat-cta i svg{color:var(--lime)}
.feat:hover .feat-cta i{transform:translateX(4px)}
.feat-art{position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.phones{display:flex;gap:14px;align-items:flex-end;padding:40px 32px 0;width:100%;justify-content:center}
.phone{flex:0 1 210px;border-radius:22px 22px 0 0;overflow:hidden;box-shadow:0 24px 60px rgba(20,22,14,.2);transition:transform .6s var(--ease)}
.phone img{width:100%;height:auto;aspect-ratio:450/800;object-fit:cover;object-position:top}
.phone:nth-child(2){transform:translateY(-36px)}
.feat:hover .phone{transform:translateY(-8px)}
.feat:hover .phone:nth-child(2){transform:translateY(-44px)}
.shot{border-radius:12px 12px 0 0;overflow:hidden;box-shadow:0 24px 60px rgba(20,22,14,.22);margin:36px 0 0 36px;transition:transform .6s var(--ease)}
.feat:hover .shot{transform:translateY(-6px) scale(1.01)}
.shot img{width:100%;height:auto}
.feat-art:has(.mock){align-items:center}
.mock{width:100%;height:100%;display:flex;justify-content:center;align-items:center;padding:clamp(28px,3.5vw,52px)}
.mock img{width:100%;max-width:560px;height:auto;filter:drop-shadow(0 28px 36px rgba(20,22,14,.18)) drop-shadow(0 6px 10px rgba(20,22,14,.08));transition:transform .7s var(--ease)}
.feat:hover .mock img{transform:translateY(-8px)}
.feat.inkc .mock{background:radial-gradient(55% 50% at 50% 55%, rgba(185,226,91,.14), transparent 70%)}
.feat.inkc .mock img{filter:drop-shadow(0 30px 50px rgba(0,0,0,.45))}
.cover-mock{justify-content:center;align-items:center;padding:clamp(28px,4vw,64px)!important}
.cover-mock img{width:100%;max-width:680px;height:auto;filter:drop-shadow(0 30px 40px rgba(20,22,14,.18))}
@media (max-width:1080px){.mock img{max-width:520px}}
@media (max-width:560px){.mock{padding:8px 20px 28px}.cover-mock{overflow:visible}}
.feat.half{display:flex;flex-direction:column}
.feat.half .feat-body{flex:1 1 auto;justify-content:flex-start}
.feat.half .feat-body > div:last-child{margin-top:auto}
.feat.half h3{min-height:2.1em}
.feat.half p.desc{min-height:4.8em}
.feat.half .feat-art{flex:none;display:block;padding:0 clamp(24px,3vw,44px) clamp(24px,3vw,44px)}
.feat.half .shot{margin:0;width:100%;aspect-ratio:16/10;border-radius:12px;border:1px solid var(--line);box-shadow:none;overflow:hidden;background:var(--card)}
.feat.half .shot img{width:100%;height:100%;object-fit:cover;object-position:left top}
.feat.half:hover .shot{transform:translateY(-4px)}
@media (max-width:860px){.feat.half h3,.feat.half p.desc{min-height:0}}
.caption-chip{position:absolute;left:16px;top:16px;z-index:2;background:rgba(20,22,14,.72);color:var(--paper);padding:6px 10px;border-radius:var(--r-pill);backdrop-filter:blur(8px)}

/* Role map (payment gateway, no UI available) */
.rolemap{padding:8px clamp(24px,3vw,44px) clamp(24px,3vw,44px);display:flex;flex-direction:column;gap:10px}
.rm-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rm-node{background:rgba(24,32,10,.07);border:1px solid rgba(24,32,10,.16);border-radius:var(--r-md);padding:14px 12px;display:flex;flex-direction:column;gap:6px;min-height:118px}
.rm-node b{font-weight:500;font-size:.95rem;letter-spacing:-.01em}
.rm-node span{font-size:.8rem;opacity:.72;line-height:1.4}
.rm-bus{border:1px dashed rgba(24,32,10,.35);border-radius:var(--r-md);padding:10px 12px;text-align:center;font-size:.82rem}
.rm-flow{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:.78rem;flex-wrap:wrap}
.rm-flow span{padding:6px 10px;border-radius:var(--r-pill);background:var(--lime-ink);color:var(--lime);white-space:nowrap}
.rm-flow i{flex:1;height:1px;background:rgba(24,32,10,.3);min-width:10px}

/* ============ More work list ============ */
.more{margin-top:clamp(72px,8vw,112px)}
.more-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px 48px;flex-wrap:wrap;padding-top:clamp(40px,5vw,64px);border-top:1px solid var(--line);margin-bottom:clamp(32px,4vw,52px)}
.more-head .h2{max-width:20ch;margin:0}
.more-head .muted-h{color:var(--muted)}
.more-head p{max-width:34ch;color:var(--muted);font-size:.95rem}
.mw-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.mw{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;aspect-ratio:4/5;border-radius:var(--r-lg);text-decoration:none;color:var(--text);
  background:radial-gradient(90% 70% at 100% 0%, color-mix(in srgb, var(--tint) 85%, white) 0%, transparent 60%),
             radial-gradient(80% 60% at 0% 100%, color-mix(in srgb, var(--tint) 60%, white) 0%, transparent 70%),
             linear-gradient(160deg, color-mix(in srgb, var(--tint) 35%, var(--paper)) 0%, var(--paper-2) 100%)}
.mw::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.45) 45%, transparent 60%);opacity:.6}
.mw-head{position:relative;z-index:2;padding:clamp(28px,3vw,40px) clamp(24px,2.6vw,36px) clamp(24px,2.6vw,36px);padding-right:72px;display:flex;flex-direction:column;gap:12px;max-width:92%}
.mw-kicker{display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:color-mix(in srgb, var(--text) 60%, transparent)}
.mw h4{margin:0;font-weight:500;font-size:clamp(1.6rem,1.1rem + 1.3vw,2.25rem);line-height:1.05;letter-spacing:-.035em}
.mw-desc{color:color-mix(in srgb, var(--text) 68%, transparent);font-size:.93rem;line-height:1.5;max-width:34ch}
.mw-foot{display:flex;gap:14px;align-items:center;color:color-mix(in srgb, var(--text) 55%, transparent)}
.mw-live{display:inline-flex;align-items:center;gap:6px;color:var(--text)}
.mw-live i{width:7px;height:7px;border-radius:50%;background:#58b83a;box-shadow:0 0 0 3px rgba(88,184,58,.18)}
.mw-live.off{color:color-mix(in srgb, var(--text) 55%, transparent)}
.mw-arrow{position:absolute;z-index:3;right:clamp(18px,2vw,26px);top:clamp(18px,2vw,26px);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.6);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.8);transition:background-color .3s,color .3s,transform .4s var(--ease)}
.mw-arrow svg{width:15px;height:15px}
a.mw:hover .mw-arrow{background:var(--ink);color:var(--lime);border-color:var(--ink);transform:rotate(45deg)}
.mw-shot{position:relative;z-index:1;flex:none;margin-top:auto;margin-left:20%;width:96%;transform:translateY(40px);padding:8px;border-radius:16px;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.75);backdrop-filter:blur(10px);box-shadow:0 30px 60px -30px rgba(20,22,14,.35);transition:transform .8s var(--ease)}
.mw-shot img{display:block;width:100%;aspect-ratio:16/10;height:auto;object-fit:cover;object-position:left top;border-radius:10px}
.mw-shot .services{aspect-ratio:16/10;min-height:0!important}
.mw h4{min-height:2.1em}
.mw-desc{min-height:6em}
@media (max-width:560px){.mw h4,.mw-desc{min-height:0}}
.mw-shot .services{border-radius:10px;padding:12px;min-height:220px}
.mw-shot .services b{font-size:.9rem;line-height:1.25}
.mw-shot .services span{font-size:.72rem}
a.mw:hover .mw-shot{transform:translate(-12px,28px)}
@media (max-width:1080px){.mw-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.mw-grid{grid-template-columns:1fr}.mw{aspect-ratio:auto;min-height:0}.mw-shot{margin-left:12%;margin-top:18px}.more-head{flex-direction:column;align-items:flex-start;gap:8px}}
.rows{border-bottom:1px solid var(--line)}
.row{border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-btn{width:100%;background:none;border:0;padding:22px 0;display:grid;grid-template-columns:48px minmax(0,4fr) minmax(0,4fr) minmax(0,3fr) 32px;gap:16px;align-items:center;text-align:left;cursor:pointer}
.row-btn .n{color:var(--muted)}
.row-btn .t{font-size:clamp(1.15rem,1rem + .5vw,1.45rem);letter-spacing:-.02em;line-height:1.2}
.row-btn .c{color:var(--muted);font-size:var(--t-small)}
.row-btn .p{font-size:var(--t-small)}
.row-btn .x{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:transform .3s var(--ease), background-color .2s}
.row-btn .x svg{width:14px;height:14px}
.row-btn[aria-expanded="true"] .x{transform:rotate(45deg);background:var(--ink);color:var(--paper);border-color:var(--ink)}
.row-btn:hover .t{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.row-panel{display:grid;grid-template-columns:48px minmax(0,4fr) minmax(0,7fr) 32px;gap:16px;padding-bottom:28px}
.row-panel .rp-text{grid-column:2;display:flex;flex-direction:column;gap:14px;max-width:44ch}
.row-panel .rp-art{grid-column:3 / span 2}
.rp-art img{border-radius:var(--r-md);border:1px solid var(--line);width:100%;height:auto}
.rp-links{display:flex;flex-wrap:wrap;gap:8px 18px}
.services{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:var(--paper-2);border-radius:var(--r-md);padding:14px}
.services div{background:var(--card);border-radius:10px;padding:16px 12px;display:flex;flex-direction:column;gap:6px;min-height:110px;justify-content:space-between}
.services b{font-weight:500}
.services span{font-size:.78rem;color:var(--muted)}
.services .hub{grid-column:1 / -1;min-height:auto;background:var(--ink);color:var(--paper);text-align:center}
.services .hub span{color:var(--muted-d)}

/* ============ Approach ============ */
.steps2{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;position:relative}
.steps2::before{content:"";position:absolute;left:28px;right:28px;top:39px;height:1px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 12px);z-index:0}
.st{position:relative;z-index:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:14px;transition:transform .5s var(--ease),border-color .3s,box-shadow .5s var(--ease)}
.st:hover{transform:translateY(-6px);border-color:rgba(21,23,15,.24);box-shadow:0 24px 44px -28px rgba(20,22,14,.35)}
.st-top{display:flex;justify-content:space-between;align-items:center}
.st-n{font-size:2.6rem;line-height:1;letter-spacing:-.05em;font-weight:500;color:transparent;-webkit-text-stroke:1px rgba(21,23,15,.35)}
.st-dot{width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--ink)}
.st h3{font-size:1.3rem;letter-spacing:-.02em}
.st p{color:var(--muted);font-size:.92rem;line-height:1.5;min-height:3em}
.st ul{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.st li{font-size:.76rem;padding:4px 10px;border-radius:var(--r-pill);background:var(--paper);border:1px solid var(--line)}
.st-last{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.st-last .st-n{-webkit-text-stroke:1px rgba(185,226,91,.7)}
.st-last .st-dot{background:var(--lime);border-color:var(--lime);box-shadow:0 0 0 5px rgba(185,226,91,.18)}
.st-last p{color:var(--muted-d)}
.st-last li{background:rgba(244,244,238,.06);border-color:var(--line-d);color:var(--paper)}
/* mini visuals */
.sv{height:112px;border-radius:12px;background:var(--paper);position:relative;overflow:hidden}
.st-last .sv{background:var(--ink-3)}
.sv-u span{position:absolute;font-size:.7rem;padding:6px 10px;border-radius:12px;white-space:nowrap}
.sv-u .b1{left:12px;top:10px;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:3px}
.sv-u .b2{right:12px;top:42px;background:var(--ink);color:var(--paper);border-bottom-right-radius:3px}
.sv-u .b3{left:12px;bottom:8px;background:var(--lime);color:var(--lime-ink);font-family:var(--f-mono);letter-spacing:.04em}
.sv-s i{position:absolute;font-style:normal;font-size:.66rem;padding:4px 8px;border-radius:6px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
.sv-s .n0{left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sv-s .n1{left:10%;bottom:14px}.sv-s .n2{left:50%;bottom:14px;transform:translateX(-50%)}.sv-s .n3{right:10%;bottom:14px}
.sv-s b{position:absolute;left:22%;right:22%;top:40px;bottom:40px;border:1px solid rgba(21,23,15,.3);border-bottom:0;border-radius:8px 8px 0 0}
.sv-s b::after{content:"";position:absolute;left:50%;top:-12px;bottom:0;border-left:1px solid rgba(21,23,15,.3)}
.sv-d i{position:absolute;border-radius:5px;background:var(--card);border:1px solid var(--line)}
.sv-d .h{left:12px;right:12px;top:12px;height:12px;background:var(--ink);border-color:var(--ink)}
.sv-d .a{left:12px;top:32px;width:28%;bottom:12px}
.sv-d .c1{left:calc(28% + 20px);right:12px;top:32px;height:30px;background:var(--lime);border-color:var(--lime)}
.sv-d .c2{left:calc(28% + 20px);width:calc(36% - 20px);top:70px;bottom:12px}
.sv-d .c3{right:12px;width:calc(36% - 20px);top:70px;bottom:12px}
.sv-v{display:flex;align-items:flex-end;gap:8px;padding:14px 14px 12px}
.sv-v i{flex:1;height:var(--h);border-radius:5px 5px 2px 2px;background:rgba(21,23,15,.14);transition:height .8s var(--ease)}
.sv-v i:last-child{background:var(--lime-2)}
.st:hover .sv-v i{height:calc(var(--h) * 1.08)}
.sv-h{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:12px 14px}
.sv-h span{font-size:.72rem;color:var(--muted-d);display:flex;align-items:center;gap:8px}
.sv-h span::before{content:"✓";display:grid;place-items:center;width:16px;height:16px;border-radius:50%;background:rgba(185,226,91,.18);color:var(--lime);font-size:.62rem}
.sv-h em{position:absolute;right:12px;bottom:12px;font-style:normal;font-family:var(--f-mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:var(--r-pill);background:var(--lime);color:var(--lime-ink)}
@media (max-width:1080px){.steps2{grid-template-columns:repeat(3,minmax(0,1fr))}.steps2::before{display:none}}
@media (max-width:760px){.steps2{grid-template-columns:repeat(2,minmax(0,1fr))}.st-last{grid-column:1 / -1}}
@media (max-width:560px){.steps2{grid-template-columns:1fr}.st p{min-height:0}}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border-top:1px solid var(--line)}
.step{padding:24px 20px 8px 0;display:flex;flex-direction:column;gap:14px;position:relative}
.step + .step{padding-left:20px;border-left:1px solid var(--line)}
.step .num{display:flex;align-items:center;gap:10px;color:var(--muted)}
.step .num::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink)}
.step:last-child .num::before{background:var(--lime-2)}
.step h3{font-size:1.3rem;letter-spacing:-.02em}
.step p{color:var(--muted);font-size:.93rem;line-height:1.55}
.step ul{display:flex;flex-direction:column;gap:6px;font-size:var(--t-small);margin-top:auto;padding-top:10px}
.step li::before{content:"— ";color:var(--muted)}

/* ===== How I work carousel ===== */
.hw-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:clamp(32px,4vw,52px)}
.hw-head .h2{max-width:22ch;margin:0}
.hw-sub{color:var(--muted)}
.hw-nav{display:flex;gap:10px}
.hw-btn{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;transition:transform .3s var(--ease),background-color .25s,opacity .25s}
.hw-btn svg{width:18px;height:18px}
.hw-btn.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hw-btn:hover:not(:disabled){transform:scale(1.06)}
.hw-btn:disabled{opacity:.35;cursor:default}
.hw-viewport{overflow:hidden;padding:36px 0 52px;touch-action:pan-y}
.hw-track{list-style:none;margin:0;display:flex;gap:16px;padding:0;padding-left:max(var(--gutter), calc((100vw - var(--max)) / 2 + var(--gutter)));padding-right:max(var(--gutter), calc((100vw - var(--max)) / 2 + var(--gutter)));width:max-content;transform:translate3d(var(--x,0px),0,0);transition:transform .9s cubic-bezier(.22,.8,.2,1);will-change:transform;cursor:grab;outline:none}
.hw-track.drag{transition:none;cursor:grabbing}
.hw-track:focus-visible{outline:2px solid var(--lime-2);outline-offset:6px;border-radius:16px}
.hw-card{flex:0 0 clamp(260px,24vw,320px);background:#fff;border:1px solid transparent;border-radius:14px;padding:22px 22px 20px;display:flex;flex-direction:column;justify-content:space-between;gap:28px;min-height:260px;user-select:none;
  transform:translateY(var(--y,0px)) scale(var(--s,.92));transform-origin:center center;opacity:var(--o,.7);transition:transform .7s cubic-bezier(.22,.8,.2,1),opacity .5s,border-color .35s,background-color .35s,box-shadow .6s}
.hw-card:nth-child(odd){--y:0px}
.hw-card.on{--s:1.04;--o:1;border-color:rgba(21,23,15,.16);box-shadow:0 18px 36px -26px rgba(20,22,14,.4);position:relative;z-index:2}
.hw-card.on .hw-ico{background:var(--ink);color:var(--paper)}
.hw-last.on .hw-ico{background:var(--lime);color:var(--lime-ink)}
.hw-card:not(.on):hover{--s:.95;--o:.9}
/* entrance: uses opacity + the separate `translate` property so it never fights the stagger/slide transforms */
.js .hw:not(.in) .hw-card{translate:0 40px;filter:opacity(0)}
.js .hw.in .hw-card{animation:hwIn .8s cubic-bezier(.22,.8,.2,1) both;animation-delay:calc(var(--k) * 90ms)}
@keyframes hwIn{from{translate:0 40px;filter:opacity(0)}to{translate:0 0;filter:opacity(1)}}
.hw-ico{transition:background-color .35s,color .35s}
.hw-top{display:flex;flex-direction:column;gap:8px}
.hw-n{color:var(--muted)}
.hw-card h3{font-size:1.2rem;font-weight:500;letter-spacing:-.02em;line-height:1.2}
.hw-card p{color:var(--muted);font-size:.9rem;line-height:1.45;margin-top:6px}
.hw-bot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hw-bot ul{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.hw-bot li{font-size:.74rem;padding:4px 10px;border-radius:var(--r-pill);background:var(--paper);border:1px solid var(--line)}
.hw-ico{flex:none;width:38px;height:38px;border-radius:10px;background:var(--paper);display:grid;place-items:center;color:var(--text)}
.hw-ico svg{width:18px;height:18px}
.hw-last{background:#fff}

.hw-last li{background:rgba(244,244,238,.06);border-color:var(--line-d)}
.hw-last .hw-ico{background:var(--lime);color:var(--lime-ink)}
.hw-last .sv{background:var(--ink-3)}
.hw-rail{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(8px,1.4vw,18px);margin-top:4px}
.hw-seg{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:12px;padding:6px 0}
.hw-seg-l{color:var(--muted);transition:color .4s}
.hw-seg:hover .hw-seg-l{color:var(--text)}
.hw-seg-t{position:relative;display:block;height:3px;border-radius:2px;background:rgba(21,23,15,.12);overflow:hidden}
.hw-seg-t i{position:absolute;inset:0;transform-origin:left center;transform:scaleX(var(--p,0));background:var(--ink);border-radius:2px}
.hw-seg.done .hw-seg-l{color:var(--text)}
.hw-seg.on .hw-seg-l{color:var(--text)}
.hw-seg.on .hw-seg-t i{background:linear-gradient(90deg,var(--ink),var(--ink) 80%,var(--lime-2))}
.hw-seg:focus-visible .hw-seg-l{outline:2px solid var(--lime-2);outline-offset:4px;border-radius:4px}
.hw-seg-t i.ease{transition:transform .6s cubic-bezier(.22,.8,.2,1)}
@media (max-width:560px){.hw-seg-l{font-size:.6rem;letter-spacing:.04em}}
@media (max-width:560px){.hw-btn{width:46px;height:46px}.hw-card{flex-basis:78vw;min-height:240px}.hw-card:nth-child(odd){--y:0px}}
/* ============ Why me ============ */
.why-head{margin-bottom:clamp(32px,4vw,52px)}
.why-head .h2{max-width:24ch}
.why-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.why-card{position:relative;overflow:hidden;border-radius:18px;aspect-ratio:4/5;isolation:isolate;display:flex;flex-direction:column}
.why-bg{position:absolute;inset:-8% 0;height:116%!important;width:100%;height:100%;object-fit:cover;z-index:-1;transition:transform 1.4s var(--ease)}
.why-card:hover .why-bg{transform:scale(1.05)}
.why-a{justify-content:flex-end;color:#fff}
.why-a::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(12,16,6,0) 35%,rgba(12,16,6,.55) 100%)}
.why-a-body{padding:clamp(22px,2.4vw,32px);display:flex;flex-direction:column;gap:20px;align-items:flex-start}
.why-a-t{font-size:clamp(1.3rem,1rem + .9vw,1.7rem);line-height:1.2;letter-spacing:-.025em;max-width:16ch}
.why-b{justify-content:space-between;color:#fff}
.why-b::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(12,16,6,.1),rgba(12,16,6,.35))}
.why-glass{margin:clamp(14px,1.6vw,20px);padding:18px;border-radius:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);display:flex;flex-direction:column;gap:14px}
.wg-top{display:flex;align-items:center;gap:8px;font-size:.82rem}
.wg-dot{width:8px;height:8px;border-radius:50%;background:var(--lime)}
.wg-tag{margin-left:auto;font-size:.7rem;padding:3px 9px;border-radius:var(--r-pill);background:rgba(185,226,91,.25);border:1px solid rgba(185,226,91,.55)}
.wg-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.wg-row b{display:block;font-weight:400;font-size:clamp(2rem,1.4rem + 1.4vw,2.6rem);letter-spacing:-.04em;line-height:1}
.wg-row small{font-size:.72rem;opacity:.8}
.wg-ring{position:relative;width:112px;height:112px;flex:none}
.wg-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.wg-ring circle{fill:none;stroke:rgba(255,255,255,.22);stroke-width:8}
.wg-ring circle.r{stroke:var(--lime);stroke-linecap:round;stroke-dasharray:0 100;transition:stroke-dasharray 1.6s cubic-bezier(.22,.8,.2,1) .2s}
.why-b.seen .wg-ring circle.r,.no-io .wg-ring circle.r{stroke-dasharray:72 100}
.wg-ring > span{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.wg-ring > span b{font-size:1.5rem}
.wg-note{font-size:.76rem;line-height:1.45;opacity:.85}
.why-b-foot{display:flex;justify-content:space-between;gap:12px;padding:clamp(18px,2vw,24px);font-size:.85rem}
.why-b-foot span:last-child{opacity:.75}
.why{position:relative;isolation:isolate}
.why::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(50% 45% at 85% 0%, rgba(185,226,91,.08), transparent 70%)}
.why .eyebrow{color:var(--muted-d)}
.why-c{background:var(--ink-2);border:1px solid var(--line-d)}
.why-c p{color:var(--muted-d)!important}
.why-card{box-shadow:0 0 0 1px rgba(244,244,238,.04)}
.why-c-body{padding:clamp(22px,2.4vw,32px);display:flex;flex-direction:column;gap:10px}
.why-c h3{font-size:clamp(1.3rem,1.05rem + .7vw,1.6rem);letter-spacing:-.025em;font-weight:500}
.why-c p{color:var(--muted);font-size:.9rem;line-height:1.5;max-width:34ch}
.why-c-art{position:absolute;right:-14%;bottom:-20%;width:90%;height:auto;transition:transform 1s var(--ease)}

.cap h3 .meta{opacity:.55;font-size:.68rem;padding-top:6px}
.cap ul{display:flex;flex-direction:column;gap:0;margin-top:auto}
.cap li{padding:9px 0;border-top:1px solid var(--line);font-size:.95rem}
.cap:first-child li{border-color:var(--line-d)}

/* ============ About ============ */
.about-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:var(--col-gap);align-items:start}
.about-text{display:flex;flex-direction:column;gap:22px}
.about-text .lead{max-width:30ch}
.about-text p.body{max-width:58ch;color:rgba(244,244,238,.74)}
.facts-card{background:var(--paper);color:var(--text);border-radius:var(--r-lg);padding:8px 24px}
.facts-card dl{margin:0}
.facts-card .fr{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:16px 0;border-top:1px solid var(--line)}
.facts-card .fr:first-child{border-top:0}
.facts-card dt{color:var(--muted);font-size:var(--t-small)}
.facts-card dd{margin:0;font-size:.95rem;line-height:1.45}
.facts-card dd small{display:block;color:var(--muted);font-size:.82rem}
.about-cards{display:flex;flex-direction:column;gap:12px}
.quote-card{background:var(--ink-3);border-radius:var(--r-lg);padding:24px;display:flex;flex-direction:column;gap:14px}
.quote-card p{font-size:1.15rem;line-height:1.4;letter-spacing:-.015em}

/* ============ Contact + footer (editorial, cream + wordmark over the product wall) ============ */
.contact{position:relative;overflow:hidden;isolation:isolate;background:var(--paper);color:var(--text)}
.contact::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(rgba(21,23,15,.13) 1px, transparent 1.2px);background-size:22px 22px;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 55%,transparent 80%);mask-image:linear-gradient(180deg,#000 0%,#000 55%,transparent 80%)}
.c-top{padding-top:clamp(72px,9vw,128px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:28px;border-top:1px solid var(--line)}
.contact .section-rule{height:1px;background:var(--line)}
.c-top h2{font-size:clamp(2rem,1.2rem + 3vw,3.9rem);line-height:1.04;letter-spacing:-.04em;font-weight:300;max-width:18ch}
.c-top h2 span{color:var(--muted)}
.c-actions{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px}
.email-pill{display:flex;align-items:center;gap:6px;height:48px;padding:4px 4px 4px 20px;border-radius:var(--r-pill);background:var(--card);border:1px solid var(--line);box-shadow:0 1px 0 rgba(21,23,15,.04)}
.email{font-size:1rem;letter-spacing:-.01em;text-decoration:none;word-break:break-all;user-select:all;padding-right:8px}
.copy{height:40px;padding-inline:16px;border-radius:var(--r-pill);background:var(--ink);color:var(--paper);border:0;cursor:pointer;font-size:.85rem;font-weight:500;white-space:nowrap}
.copy{transition:background-color .3s,color .3s,transform .3s}
.copy:hover,.copy:focus-visible{background:var(--lime);color:var(--lime-ink);transform:translateY(-1px)}

.c-sign{margin-top:clamp(88px,11vw,160px);display:flex;justify-content:space-between;align-items:flex-end;gap:12px 32px;flex-wrap:wrap}
.c-sign b{font-weight:500;font-size:clamp(2.2rem,1.4rem + 3vw,4rem);line-height:.95;letter-spacing:-.05em}
.c-sign b i{font-style:normal;color:var(--lime-2)}
.c-sign p{font-size:clamp(1.1rem,.95rem + .7vw,1.6rem);font-weight:300;letter-spacing:-.025em;color:var(--muted);padding-bottom:4px}
.c-bar{margin-top:18px;border-top:1.5px solid var(--ink);padding-top:18px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px}
 .c-bar{position:relative;z-index:1;background:var(--paper)}
.c-social{display:flex;gap:8px}
.c-social a{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;text-decoration:none;transition:background-color .25s,color .25s,transform .3s var(--ease)}
.c-social a svg{width:18px;height:18px}
.c-social a:hover{background:var(--lime);color:var(--lime-ink);transform:translateY(-2px)}
.c-links{display:flex;gap:clamp(20px,3.4vw,48px);flex-wrap:wrap;justify-content:center;align-items:center;min-height:44px}
.c-links a{text-decoration:none;font-size:1.02rem;font-weight:500;letter-spacing:-.01em;color:var(--text);display:inline-flex;gap:6px;align-items:center;position:relative}
.c-links a::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1.5px;background:var(--text);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.c-links a:hover::after{transform:scaleX(1)}
.c-links a span{font-size:.9em;color:var(--muted)}
.c-legal{justify-self:end;text-align:right;color:var(--text);font-size:.92rem;line-height:1.5;display:flex;flex-direction:column;justify-content:center;min-height:44px}
.c-legal span{color:var(--muted);font-size:.85rem}
.c-mark{--wm:min(29vw,27rem);position:relative;margin-top:clamp(8px,2vw,24px);height:calc(var(--wm) * .86);overflow:hidden;isolation:isolate}
.c-mark-media{position:absolute;inset:0;z-index:-1;
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.6) 20%,#000 42%);mask-image:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.6) 20%,#000 42%)}
.c-mark-media img{width:100%;height:100%;object-fit:cover;object-position:center 72%}
.c-mark-media::after{content:"";position:absolute;inset:0;background:
  radial-gradient(38% 60% at 4% 18%, rgba(185,226,91,.45), transparent 70%),
  radial-gradient(38% 60% at 97% 12%, rgba(140,200,190,.45), transparent 70%),
  linear-gradient(180deg, rgba(244,244,238,.25), rgba(244,244,238,0) 45%)}
.c-word{position:absolute;left:0;right:0;bottom:0;text-align:center;font-weight:500;font-size:var(--wm);line-height:.8;letter-spacing:-.055em;color:var(--ink);white-space:nowrap;user-select:none;transform:translateY(7%)}
@media (max-width:860px){
  .c-bar{grid-template-columns:1fr;gap:14px}
  .c-links{justify-content:flex-start;padding-top:0}
  .c-legal{justify-self:start;text-align:left;padding-top:0}
  .c-sign{flex-direction:column;align-items:flex-start;gap:8px}
}
@media (max-width:560px){
  .email-pill{width:100%;justify-content:space-between;padding-left:18px}
  .email{font-size:.92rem}
  .c-actions{width:100%}
  .c-actions .btn{width:100%;justify-content:center}
}

/* ============ Case study ============ */
.cs-hero{background:var(--ink);color:var(--paper);position:relative;overflow:hidden;isolation:isolate}
.cs-hero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(60% 70% at 80% 0%, rgba(185,226,91,.13), transparent 70%),linear-gradient(180deg,#22261a, var(--ink) 70%)}
.cs-hero-inner{padding-top:calc(140px + env(safe-area-inset-top,0px));padding-bottom:clamp(48px,6vw,80px)}
.crumbs{display:flex;align-items:center;gap:10px;color:var(--muted-d);margin-bottom:28px}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--paper)}
.cs-hero h1{font-size:clamp(2.4rem,1.2rem + 4.4vw,5rem);line-height:1.02;letter-spacing:-.045em;max-width:17ch}
.cs-hero .lead{margin-top:24px;max-width:46ch;color:rgba(244,244,238,.75)}
.cs-meta{margin-top:clamp(40px,5vw,64px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line-d)}
.cs-meta div{padding:18px 18px 0 0;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.cs-meta div + div{padding-left:18px;border-left:1px solid var(--line-d)}
.cs-meta span{color:var(--muted-d)}
.cs-meta a{color:var(--lime)}
.cs-cover{background:linear-gradient(180deg,var(--ink) 0 38%, var(--paper) 38%)}
.cover-frame{border-radius:var(--r-lg);overflow:hidden;background:var(--paper-2);padding:clamp(20px,4vw,56px) clamp(20px,4vw,56px) 0;display:flex;gap:clamp(10px,1.6vw,20px);justify-content:center;align-items:flex-end}
.cover-frame .phone{flex:0 1 240px;box-shadow:0 30px 70px rgba(20,22,14,.18)}
.cover-frame .phone:nth-child(2){transform:translateY(-28px)}
.cover-frame .shot{margin:0;flex:1;max-width:900px}
.cover-frame .shot img{width:100%;height:auto}
.cs-body{padding-block:clamp(56px,7vw,110px)}
.cs-layout{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:var(--col-gap)}
.toc{position:sticky;top:110px;align-self:start;display:flex;flex-direction:column;gap:2px}
.toc a{display:grid;grid-template-columns:34px 1fr;padding:7px 0;text-decoration:none;font-size:.9rem;color:var(--muted);transition:color .2s}
.toc a .meta{padding-top:3px}
.toc a:hover,.toc a.on{color:var(--text)}
.toc a.on .meta{color:var(--lime-2)}
.cs-sections{display:flex;flex-direction:column;gap:clamp(64px,7vw,104px)}
.cs-sec{scroll-margin-top:110px;display:flex;flex-direction:column;gap:22px}
.cs-sec > .meta{color:var(--muted);display:flex;gap:12px;align-items:center}
.cs-sec > .meta::after{content:"";flex:1;height:1px;background:var(--line)}
.cs-sec h2{font-size:clamp(1.6rem,1.2rem + 1.4vw,2.4rem);line-height:1.1;letter-spacing:-.03em;max-width:22ch}
.cs-sec p{max-width:62ch;color:#3a3c33}
.cs-sec p.lead{color:var(--text)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:10px}
.box h3{font-size:1.1rem;letter-spacing:-.015em}
.box p{font-size:.95rem;color:var(--muted)}
.box.inkb{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.box.inkb p{color:var(--muted-d)}
.box.sageb{background:var(--paper-2);border-color:transparent}
.box .meta{color:var(--muted)}
.box.inkb .meta{color:var(--lime)}
.problem{background:var(--ink);color:var(--paper);border-radius:var(--r-lg);padding:clamp(24px,3.4vw,48px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
.problem .meta{color:var(--lime)}
.problem p{color:rgba(244,244,238,.86);font-size:var(--t-lead);line-height:1.4;letter-spacing:-.012em;max-width:none}
.focus-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--line)}
.focus-list div{padding:18px 16px 0 0;display:flex;flex-direction:column;gap:6px}
.focus-list div + div{padding-left:16px;border-left:1px solid var(--line)}
.focus-list.f5{grid-template-columns:repeat(5,minmax(0,1fr))}
.focus-list b{font-weight:500}
.focus-list span{font-size:.88rem;color:var(--muted)}
/* scope map */
.scope{background:var(--paper-2);border-radius:var(--r-lg);padding:clamp(16px,2.4vw,28px);display:flex;flex-direction:column;gap:10px}
.scope-root{background:var(--ink);color:var(--paper);border-radius:var(--r-md);padding:14px 16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.scope-root b{font-weight:500}
.scope-root span{color:var(--muted-d);font-size:.85rem}
.scope-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.scope-node{background:var(--card);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:8px}
.scope-node b{font-weight:500;font-size:.95rem}
.scope-node ul{display:flex;flex-direction:column;gap:3px;font-size:.84rem;color:var(--muted)}
.scope-note{font-size:.8rem;color:var(--muted)}
/* gallery */
.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.gallery.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.gallery figure{margin:0;display:flex;flex-direction:column;gap:10px}
.gallery .frame{border-radius:var(--r-md);overflow:hidden;background:var(--paper-2)}
.gallery img{width:100%;height:auto;transition:transform .6s var(--ease)}
.gallery figure:hover img{transform:scale(1.02)}
.gallery figcaption{font-size:.84rem;color:var(--muted);line-height:1.4}
.gallery figcaption b{display:block;color:var(--text);font-weight:500}
.wide-shot{margin:0;display:flex;flex-direction:column;gap:10px}
.wide-shot .frame{border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line)}
.wide-shot img{width:100%;height:auto}
.wide-shot figcaption{font-size:.84rem;color:var(--muted)}
/* decisions */
.decisions{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.decision{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr) minmax(0,3fr);gap:20px;padding:22px 0;border-bottom:1px solid var(--line);align-items:start}
.decision h3{font-size:1.15rem;letter-spacing:-.015em}
.decision p{font-size:.95rem;color:var(--muted)}
.decision .frame{border-radius:10px;overflow:hidden;background:var(--paper-2)}
/* v1 v2 */
.versions{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);align-items:stretch;gap:0}
.versions .arrow{display:grid;place-items:center;color:var(--muted)}
.versions .arrow svg{width:20px;height:20px}
/* placeholders */
.todo{border:1.5px dashed rgba(21,23,15,.28);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:10px;background:repeating-linear-gradient(135deg,transparent 0 12px,rgba(21,23,15,.025) 12px 24px)}
.todo .meta{color:var(--muted)}
.todo ul{display:flex;flex-wrap:wrap;gap:6px}
.todo li{font-family:var(--f-mono);font-size:.78rem;padding:5px 10px;border-radius:var(--r-pill);background:var(--card);border:1px solid var(--line)}
.outcome{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.live-card{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:var(--lime);color:var(--lime-ink);border-radius:var(--r-lg);padding:22px 24px}
.live-card b{font-weight:500;font-size:1.15rem;letter-spacing:-.015em}
.live-card .links{display:flex;gap:8px;flex-wrap:wrap}
.live-card .btn-ink{height:42px}
.next{border-top:1px solid var(--line);margin-top:clamp(64px,7vw,104px);padding-top:28px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.next a{text-decoration:none;display:flex;flex-direction:column;gap:6px;max-width:48%}
.next a:last-child{text-align:right;margin-left:auto}
.next a .h3{transition:color .2s}
.next a:hover .h3{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}

/* ============ View transitions + reveal ============ */
#view{transition:opacity .28s var(--ease), transform .28s var(--ease)}
#view.leaving{opacity:0;transform:translateY(8px)}
.rv{transition:translate 1s cubic-bezier(.22,.8,.2,1), opacity 1s cubic-bezier(.22,.8,.2,1), filter 1s cubic-bezier(.22,.8,.2,1);transition-delay:var(--d,0s)}
.js .rv.pre{translate:0 28px;opacity:0;filter:blur(10px)}
/* word-by-word blur-in for headings */
.bw{display:inline-block;white-space:pre;transition:opacity .9s cubic-bezier(.22,.8,.2,1),filter .9s cubic-bezier(.22,.8,.2,1),translate .9s cubic-bezier(.22,.8,.2,1);transition-delay:calc(var(--i) * 45ms)}
.js .bwrap.pre .bw{opacity:0;filter:blur(12px);translate:0 .35em}
/* text blocks fade from blur */
.bt{transition:opacity 1.1s cubic-bezier(.22,.8,.2,1),filter 1.1s cubic-bezier(.22,.8,.2,1),translate 1.1s cubic-bezier(.22,.8,.2,1);transition-delay:var(--d,.15s)}
.js .bt.pre{opacity:0;filter:blur(8px);translate:0 14px}
/* parallax uses the independent `translate` property so hover transforms still work */
[data-px]{will-change:translate}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .js .rv.pre,.js .bt.pre{translate:none;opacity:1;filter:none}
  .js .bwrap.pre .bw{opacity:1;filter:none;translate:none}
}

/* ============ Responsive ============ */
@media (max-width: 1080px){
  .feat.wide{grid-template-columns:1fr;min-height:0}
  .feat.wide .feat-art{order:2}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .step:nth-child(odd){padding-left:0;border-left:0}
  .step:nth-child(n+3){border-top:1px solid var(--line);margin-top:8px}
  .step:last-child{grid-column:1 / -1}
  .caps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .exp-grid,.about-grid,.contact-inner{grid-template-columns:1fr}
  .exp-left{position:static}
  .cs-layout{grid-template-columns:1fr}
  .toc{display:none}
  .decision{grid-template-columns:1fr 1fr}
  .decision .frame{grid-column:1 / -1;max-width:260px}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}

}
@media (max-width: 860px){
  .nav-links{display:none}
  .menu-btn{display:inline-flex}
  .nav .btn-white{display:none}
  .sheet{display:block;position:fixed;inset:0;z-index:49;background:rgba(20,22,14,.96);backdrop-filter:blur(12px);color:var(--paper);padding:calc(96px + env(safe-area-inset-top,0px)) var(--gutter) calc(24px + env(safe-area-inset-bottom,0px));opacity:0;visibility:hidden;transition:opacity .3s, visibility .3s}
  .menu-open .sheet{opacity:1;visibility:visible}
  .sheet a{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--line-d);text-decoration:none;font-size:1.8rem;letter-spacing:-.03em}
  .sheet .sheet-actions{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
  .sheet .sheet-actions a{font-size:.95rem;border:0;padding:0 22px;display:inline-flex}
  .featured{grid-template-columns:1fr}
  .cred{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cred li:nth-child(3){padding-left:0;border-left:0}
  .cred li:nth-child(n+3){border-top:1px solid var(--line-d)}
  .row-btn{grid-template-columns:36px minmax(0,1fr) 32px;row-gap:4px}
  .row-btn .c,.row-btn .p{grid-column:2}
  .row-btn .x{grid-column:3;grid-row:1}
  .row-panel{grid-template-columns:36px minmax(0,1fr)}
  .row-panel .rp-text,.row-panel .rp-art{grid-column:2}
  .cs-meta{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cs-meta div:nth-child(3){padding-left:0;border-left:0}
  .cs-meta div:nth-child(n+3){padding-top:18px}
  .problem{grid-template-columns:1fr}
  .gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gallery.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .three,.outcome{grid-template-columns:1fr}
  .focus-list{grid-template-columns:repeat(2,minmax(0,1fr))}
  .focus-list div:nth-child(3){padding-left:0;border-left:0}
  .focus-list div:nth-child(n+3){border-top:1px solid var(--line);margin-top:14px}
  .focus-list.f5{grid-template-columns:1fr;border-top:0}
  .focus-list.f5 div{padding:14px 0;border-left:0;border-top:1px solid var(--line);margin-top:0;flex-direction:row;justify-content:space-between;gap:16px}
  .focus-list.f5 div + div{padding-left:0}
}
@media (max-width: 560px){
  :root{--sec:72px}
  .hero-inner{padding-top:calc(120px + env(safe-area-inset-top,0px))}
  .hero h1{letter-spacing:-.04em}
  .hero-actions .btn{flex:1 1 auto;justify-content:center}
  .facts{grid-template-columns:1fr;gap:10px}
  .fact{min-height:240px;padding:22px}
  .fact.photo{min-height:420px}

  .sec-head{flex-direction:column;align-items:flex-start;gap:16px}
  /* featured cards: phones become a swipe strip */
  .phones{justify-content:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;padding:28px 20px 0;gap:10px;scrollbar-width:none}
  .phones::-webkit-scrollbar{display:none}
  .phone{flex:0 0 58%;scroll-snap-align:start}
  .phone:nth-child(2){transform:none}
  .feat:hover .phone,.feat:hover .phone:nth-child(2){transform:none}
  .shot{margin:24px 0 0 20px}
  .rm-row{grid-template-columns:1fr}
  .rm-node{min-height:0}
  .steps{grid-template-columns:1fr}
  .step,.step + .step{padding-left:0;border-left:0}
  .step + .step{border-top:1px solid var(--line);margin-top:8px}
  .caps{grid-template-columns:1fr}
  .cap{min-height:0}
  .socials{grid-template-columns:1fr}
  .role-head{grid-template-columns:1fr;padding:20px 18px 0}
  .role-head .when,.role-head .where{text-align:left}
  .role-body{padding:14px 18px 20px}
  .facts-card .fr{grid-template-columns:1fr;gap:2px}
  .cover-frame{justify-content:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
  .cover-frame::-webkit-scrollbar{display:none}

function syShot(n, alt, pins, cls){

  return `<figure class="sy-shot ${cls||''}"><div class="sy-frame">${src}${(pins||[]).map((p,k)=>`<span class="sy-pin" style="left:${p[0]}%;top:${p[1]}%" aria-hidden="true">${k+1}</span>`).join('')}</div></figure>`;
}
function syNotes(list){
  return `<ol class="sy-notes">${list.map((t,k)=>`<li><span class="sy-num">${k+1}</span><div><b>${t[0]}</b><p>${t[1]}</p></div></li>`).join('')}</ol>`;
}
function syChapter(n, id, kicker, title, body, dark){

}

  const next = CASES[ORDER[(i+1)%ORDER.length]], nextSlug = ORDER[(i+1)%ORDER.length];
  if(slug==='payment-gateway') return buildStory(c, prev, prevSlug, next, nextSlug);
  const secs = c.sections.map((s,k)=>{
    const num = String(k+1).padStart(2,'0');
    return `<section class="cs-sec rv" id="s-${s[0]}" aria-labelledby="h-${s[0]}"><span class="meta">${num} · ${s[1]}</span><h2 id="h-${s[0]}">${s[2]}</h2>${s[3]}</section>`;

  const toc = c.sections.map((s,k)=>`<a href="#s-${s[0]}" data-sec="s-${s[0]}"><span class="meta">${String(k+1).padStart(2,'0')}</span>${s[1]}</a>`).join('');
  const el = document.createElement('div');
  el.innerHTML = `
  <section class="cs-hero" aria-labelledby="cs-title">
    <div class="wrap cs-hero-inner">
      <p class="crumbs meta"><a href="#work">← Work</a><span>/</span><span>${c.eyebrow}</span></p>

    <div class="cs-layout">
      <nav class="toc" aria-label="Case study sections">${toc}</nav>
      <div class="cs-sections">${secs}</div>
    </div>
    <nav class="next" aria-label="More case studies">
      <a href="#${prevSlug}"><span class="meta muted">← Previous</span><span class="h3">${prev.name}</span></a>
      <a href="#${nextSlug}"><span class="meta muted">Next →</span><span class="h3">${next.name}</span></a>

}

function mount(kind, slug){
  const frag = kind==='home' ? buildHome() : buildCase(slug);
  frag.appendChild(tplContact.content.cloneNode(true));
  view.replaceChildren(frag);
  current = kind==='home' ? 'home' : slug;
  document.title = kind==='home' ? 'Tareq Mahmud' : CASES[slug].name + ' · Tareq Mahmud';
  wireView();
}

let swapping = false;
function go(){
  const h = decodeURIComponent(location.hash.slice(1));
  const wantCase = !!CASES[h];
  const target = wantCase ? null : (h || 'top');
  const needSwap = wantCase ? current !== h : current !== 'home';
  const finish = () => {
    if(wantCase){ window.scrollTo({top:0, behavior:'instant'}); focusTitle('cs-title'); }
    else {
      const el = document.getElementById(target);
      if(el && target !== 'top'){ requestAnimationFrame(()=>el.scrollIntoView({behavior: needSwap ? 'instant':'smooth', block:'start'})); }
      else if(needSwap || target==='top'){ window.scrollTo({top:0, behavior: needSwap?'instant':'smooth'}); }
    }
  };
  if(!needSwap){ finish(); return; }
  if(current === null){ mount(wantCase?'case':'home', h); finish(); return; }
  if(swapping) return;
  swapping = true;
  view.classList.add('leaving');
  setTimeout(()=>{ mount(wantCase?'case':'home', h); finish(); requestAnimationFrame(()=>{ view.classList.remove('leaving'); swapping=false; }); }, 220);
}
function focusTitle(id){ const t = document.getElementById(id); if(t) t.focus({preventScroll:true}); }

/* ---------- per-view wiring ---------- */
let io, spy, pxRaf=0, pxEls=[];
function wireView(){
  // hero background video
  const vid = view.querySelector('#heroVideo'), vt = view.querySelector('#mediaToggle');
  if(vid && vt){
    const PAUSE='<svg viewBox="0 0 10 10" aria-hidden="true"><rect x="1" y="1" width="3" height="8" fill="currentColor"/><rect x="6" y="1" width="3" height="8" fill="currentColor"/></svg><span>Pause video</span>';
    const PLAY='<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1l7 4-7 4z" fill="currentColor"/></svg><span>Play video</span>';
    const setUI = paused => { vt.innerHTML = paused ? PLAY : PAUSE; vt.setAttribute('aria-pressed', String(paused)); };
    let userPaused=false; try{ userPaused = localStorage.getItem('heroVideoPaused')==='1'; }catch(e){}
    if(matchMedia('(prefers-reduced-motion: reduce)').matches) userPaused=true;
    setUI(userPaused);
    let inView=true;
    const sync=()=>{ if(inView && !userPaused){ const pr=vid.play(); if(pr&&pr.catch) pr.catch(()=>{}); } else vid.pause(); };
    vt.addEventListener('click', ()=>{ userPaused=!userPaused; setUI(userPaused); try{ localStorage.setItem('heroVideoPaused', userPaused?'1':'0'); }catch(e){} sync(); });
    if('IntersectionObserver' in window) new IntersectionObserver(es=>{ inView=es[0].isIntersecting; sync(); }).observe(vid);
    sync();
  }
  // how-i-work carousel (transform-based, so every step can be active)
  const track = view.querySelector('#hwTrack');
  if(track){
    const vp=track.parentElement, cardsEl=[...track.children], pills=[...view.querySelectorAll('.hw-seg')], bars=pills.map(p=>p.querySelector('i'));
    const prev=view.querySelector('#hwPrev'), next=view.querySelector('#hwNext'), sec=track.closest('.hw');
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const N=cardsEl.length, DUR=4500;
    let cur=0, x=0, stopped=reduce, paused=false, inView=false, raf=0, t0=0, elapsed=0;
    const maxX=()=>Math.max(0, track.scrollWidth - vp.clientWidth);
    const targetX=i=>Math.min(cardsEl[i].offsetLeft - cardsEl[0].offsetLeft, maxX());
    const setX=v=>{ x=v; track.style.setProperty('--x', (-v)+'px'); };
    const setP=(k,v,ease)=>{ bars[k].classList.toggle('ease',!!ease); bars[k].style.setProperty('--p',v); };
    function goTo(i){
      cur=(i+N)%N; setX(targetX(cur));
      cardsEl.forEach((c,k)=>c.classList.toggle('on',k===cur));
      pills.forEach((p,k)=>{ p.classList.toggle('on',k===cur); p.classList.toggle('done',k<cur); p.setAttribute('aria-current',k===cur?'step':'false'); });
      bars.forEach((b,k)=>setP(k, k<cur?1:(k===cur?(stopped?1:0):0), true));
      prev.disabled=cur===0; elapsed=0; t0=performance.now();
    }
    // autoplay with a live progress line toward the next pill
    function loop(now){
      raf=requestAnimationFrame(loop);
      if(stopped||paused||!inView){ t0=now-elapsed; return; }
      elapsed=now-t0;
      setP(cur, Math.min(1,elapsed/DUR), false);
      if(elapsed>=DUR) goTo(cur+1);
    }
    const stop=()=>{ stopped=true; setP(cur,1,true); };
    prev.addEventListener('click',()=>{stop(); goTo(cur-1);});
    next.addEventListener('click',()=>{stop(); goTo(cur+1);});
    pills.forEach(p=>p.addEventListener('click',()=>{stop(); goTo(+p.dataset.go);}));
    track.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'){e.preventDefault();stop();goTo(Math.min(N-1,cur+1));} if(e.key==='ArrowLeft'){e.preventDefault();stop();goTo(Math.max(0,cur-1));} });
    // pause only while the visitor is actually hovering the cards (real pointer movement, not page scroll) or keyboard-focused
    vp.addEventListener('pointermove',e=>{ if(e.pointerType==='mouse') paused=true; });
    vp.addEventListener('pointerleave',()=>paused=false);
    sec.addEventListener('focusin',e=>{ if(e.target.matches(':focus-visible')) paused=true; });
    sec.addEventListener('focusout',()=>paused=false);
    // drag / swipe
    let sx=0, sy=0, bx=0, dragging=false, moved=false;
    track.addEventListener('pointerdown',e=>{ dragging=true; moved=false; sx=e.clientX; sy=e.clientY; bx=x; track.setPointerCapture(e.pointerId); });
    track.addEventListener('pointermove',e=>{ if(!dragging) return; const dx=e.clientX-sx;
      if(!moved && Math.abs(dx)>6 && Math.abs(dx)>Math.abs(e.clientY-sy)){ moved=true; track.classList.add('drag'); stop(); }
      if(moved){ let v=bx-dx; const m=maxX(); if(v<0) v=v/3; if(v>m) v=m+(v-m)/3; setX(v); } });
    const end=e=>{ if(!dragging) return; dragging=false; track.classList.remove('drag');
      if(moved){ const dx=e.clientX-sx; let i=cur; if(dx<-50) i=Math.min(N-1,cur+1); else if(dx>50) i=Math.max(0,cur-1);
        // if dragged far, jump to the nearest card
        let best=i,d=1e9; cardsEl.forEach((c,k)=>{ const dd=Math.abs(targetX(k)-x); if(dd<d){d=dd;best=k;} }); if(Math.abs(dx)>220) i=best;
        goTo(i); }
      else { const c=e.target.closest('.hw-card'); if(c){ stop(); goTo(+c.dataset.i); } } };
    track.addEventListener('pointerup',end); track.addEventListener('pointercancel',end);
    addEventListener('resize',()=>{ track.classList.add('drag'); goTo(cur); requestAnimationFrame(()=>track.classList.remove('drag')); },{passive:true});
    goTo(0);
    raf=requestAnimationFrame(loop);
    if('IntersectionObserver' in window){
      new IntersectionObserver(es=>es.forEach(e=>{ inView=e.isIntersecting; if(inView) sec.classList.add('in'); }),{threshold:.25}).observe(sec);
    } else { inView=true; sec.classList.add('in'); }
    if(reduce) sec.classList.add('in');
  }
  // why-me ring
  const wb=view.querySelector('.why-b');
  if(wb){ if('IntersectionObserver' in window){ const o=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ wb.classList.add('seen'); o.disconnect(); } }),{threshold:.4}); o.observe(wb); } else wb.classList.add('seen'); }
  // capabilities tabs
  const ctabs=[...view.querySelectorAll('.cap-tab')], cpan=[...view.querySelectorAll('.cap-panel')];
  if(ctabs.length){
    let capCur=-1;
    const sel=i=>{ if(i===capCur) return; capCur=i;
      ctabs.forEach((t,k)=>{ const on=k===i; t.classList.toggle('on',on); t.setAttribute('aria-selected',String(on)); t.tabIndex=on?0:-1; });
      cpan.forEach((p,k)=>{ const on=k===i; p.hidden=!on; p.classList.toggle('on',on); }); };
    ctabs.forEach((t,i)=>{
      t.addEventListener('click',()=>sel(i));
      t.addEventListener('mouseenter',()=>{ if(matchMedia('(hover:hover)').matches) sel(i); });
      t.addEventListener('keydown',e=>{ const n=ctabs.length;
        if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();const j=(i+1)%n;sel(j);ctabs[j].focus();}
        if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();const j=(i-1+n)%n;sel(j);ctabs[j].focus();} });
    });
    sel(0);
  }
  // story progress + chapter nav
  const syBar=view.querySelector('#syBar');
  if(syBar){
    const links=[...view.querySelectorAll('.sy-toc a')];
    const upd=()=>{ const h=document.documentElement.scrollHeight-innerHeight; syBar.style.width=(h>0?scrollY/h*100:0)+'%';
      let on=null; view.querySelectorAll('.sy-ch').forEach(c=>{ if(c.getBoundingClientRect().top<innerHeight*.45) on=c.id; });
      links.forEach(a=>{ const act=a.dataset.sy===on; if(act!==a.classList.contains('on')){ a.classList.toggle('on',act); if(act) a.scrollIntoView({block:'nearest',inline:'center'}); } }); };
    if(window.__syUpd) removeEventListener('scroll',window.__syUpd);
    window.__syUpd=upd; addEventListener('scroll',upd,{passive:true}); upd();
  } else if(window.__syUpd){ removeEventListener('scroll',window.__syUpd); window.__syUpd=null; }
  // expandable rows
  view.querySelectorAll('.row-btn-unused').forEach(b=>b.addEventListener('click',()=>{
    const open = b.getAttribute('aria-expanded')==='true';
    b.setAttribute('aria-expanded', String(!open));
    document.getElementById(b.getAttribute('aria-controls')).hidden = open;
  }));
  // copy email
  view.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>{
    const v = b.getAttribute('data-copy');
    const setL=t=>{ const sp=b.querySelectorAll('.bl > span'); if(sp.length){ sp[0].textContent=t; sp[1].textContent=t; } else b.textContent=t; };
    const done = ()=>{ setL('Copied'); setTimeout(()=>setL('Copy'),1600); };
    // 1) legacy copy works inside sandboxed frames where the Clipboard API is often blocked
    const legacy=()=>{ try{ const ta=document.createElement('textarea'); ta.value=v; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;opacity:0;pointer-events:none';
        document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,v.length); const ok=document.execCommand('copy'); ta.remove(); b.focus(); return ok; }catch(e){ return false; } };
    if(legacy()){ done(); return; }
    // 2) modern API, 3) fall back to selecting the address for manual copy
    let settled=false; const fail=()=>{ if(!settled){ settled=true; selectEmail(b); } };
    try{ navigator.clipboard.writeText(v).then(()=>{ settled=true; done(); }, fail); setTimeout(fail,1200); }catch(e){ fail(); }
  }));
  // reveal: only elements below the fold get a pre-state
  if(io) io.disconnect();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if('IntersectionObserver' in window && !reduce){
    io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.remove('pre'); io.unobserve(e.target); } }),{rootMargin:'0px 0px -8% 0px'});
    // headings: split into words (text nodes only, keeps inner spans)
    view.querySelectorAll('.h2, .cs-sec h2, .contact h2, .ab-lead, .statement, .sy-t').forEach(h=>{
      if(h.dataset.split) return; h.dataset.split='1'; let i=0;
      const walk=n=>{ [...n.childNodes].forEach(c=>{ if(c.nodeType===3){ const f=document.createDocumentFragment();
            c.textContent.split(/(\s+)/).forEach(w=>{ if(!w) return; if(/^\s+$/.test(w)){ f.appendChild(document.createTextNode(w)); return; }
              const sp=document.createElement('span'); sp.className='bw'; sp.style.setProperty('--i',i++); sp.textContent=w; f.appendChild(sp); });
            c.replaceWith(f); } else if(c.nodeType===1 && !c.classList.contains('bw')) walk(c); }); };
      walk(h); h.classList.add('bwrap'); });
    // paragraphs / eyebrows / buttons fade in from blur
    view.querySelectorAll('.eyebrow, .sec-head p, .hw-head .hw-nav, .ab-text > p:not(.ab-lead), .ab-actions, .cs-sec p, .more-head p, .why-head .eyebrow, .cap-tabs, .contact-card, .c-actions, .c-sign').forEach((el,k)=>{ if(!el.closest('.hero')) el.classList.add('bt'); });
    // stagger siblings in grids
    view.querySelectorAll('.featured, .mw-grid, .why-grid, .gallery, .outcome, .three, .two').forEach(g=>{ [...g.children].forEach((c,k)=>{ c.classList.add('rv'); c.style.setProperty('--d',(k%3)*0.09+'s'); }); });
    view.querySelectorAll('.rv, .bwrap, .bt').forEach(el=>{ if(el.getBoundingClientRect().top > innerHeight*0.92 && !el.closest('.hero')){ el.classList.add('pre'); io.observe(el); } });
  }
  // parallax
  if(pxRaf) cancelAnimationFrame(pxRaf);
  // only elements that have hidden overflow room get parallax, and the shift is clamped to that room
  pxEls = reduce ? [] : [
    ...[...view.querySelectorAll('.why-bg')].map(e=>[e,0.06]),
    ...[...view.querySelectorAll('.ab-photo img')].map(e=>[e,0.05]),
    ...[...view.querySelectorAll('.hero-media video')].map(e=>[e,0.15]),
  ];
  pxEls.forEach(([e])=>e.setAttribute('data-px',''));
  const pxTick=()=>{ const vh=innerHeight;
    pxEls.forEach(([e,k])=>{ const r=e.getBoundingClientRect(); if(r.bottom<-200||r.top>vh+200) return;
      const room=(e.offsetHeight-e.parentElement.clientHeight)/2; const c=(r.top+r.height/2)-vh/2;
      const v=Math.max(-room,Math.min(room,-c*k)); e.style.translate='0 '+v.toFixed(1)+'px'; });
    pxRaf=0; };
  if(!window.__pxBound){ window.__pxBound=true; addEventListener('scroll',()=>{ if(!pxRaf) pxRaf=requestAnimationFrame(()=>window.__pxTick()); },{passive:true}); addEventListener('resize',()=>{ if(!pxRaf) pxRaf=requestAnimationFrame(()=>window.__pxTick()); }); }
  window.__pxTick=pxTick; pxTick();
  // case study TOC spy
  if(spy) spy.disconnect();
  const tocLinks = view.querySelectorAll('.toc a');
  if(tocLinks.length){
    spy = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ tocLinks.forEach(a=>a.classList.toggle('on', a.dataset.sec===e.target.id)); } }),{rootMargin:'-30% 0px -60% 0px'});
    view.querySelectorAll('.cs-sec').forEach(s=>spy.observe(s));
  }
}
function selectEmail(b){
  const a = b.parentElement.querySelector('.email');
  const r = document.createRange(); r.selectNodeContents(a);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  const setL=t=>{ const sp=b.querySelectorAll('.bl > span'); if(sp.length){ sp[0].textContent=t; sp[1].textContent=t; } else b.textContent=t; };
  setL('Press ⌘/Ctrl+C');
  setTimeout(()=>setL('Copy'),2400);
}

/* in-page anchors inside a case study scroll without leaving it */
document.addEventListener('click', e=>{
  const a = e.target.closest('a[href^="#"]');
  if(!a) return;
  const id = a.getAttribute('href').slice(1);
  closeMenu();
  if(current !== 'home' && !CASES[id]){
    const el = document.getElementById(id);
    if(el && view.contains(el)){ e.preventDefault(); el.scrollIntoView({behavior:'smooth', block:'start'}); }
  }
});

/* ---------- nav: compress on scroll, section highlight ---------- */
const nav = document.getElementById('nav');
let ticking=false;
addEventListener('scroll', ()=>{ if(ticking) return; ticking=true; requestAnimationFrame(()=>{
  nav.classList.toggle('compact', scrollY > 40);
  if(current==='home'){
    let on=null;
    ['work','why','about','contact'].forEach(id=>{ const el=document.getElementById(id); if(el && el.getBoundingClientRect().top < innerHeight*0.4) on=id; });
    document.querySelectorAll('.nav-links a').forEach(a=>a.setAttribute('aria-current', String(a.getAttribute('href')==='#'+on)));
  } else {
    document.querySelectorAll('.nav-links a').forEach(a=>a.setAttribute('aria-current', String(a.getAttribute('href')==='#work')));
  }
  ticking=false; }); }, {passive:true});

/* ---------- mobile menu ---------- */
const menuBtn = document.getElementById('menuBtn');
function closeMenu(){ document.body.classList.remove('menu-open'); menuBtn.setAttribute('aria-expanded','false'); menuBtn.setAttribute('aria-label','Open menu'); }
menuBtn.addEventListener('click', ()=>{
  const open = !document.body.classList.contains('menu-open');
  document.body.classList.toggle('menu-open', open);
  menuBtn.setAttribute('aria-expanded', String(open));
  menuBtn.setAttribute('aria-label', open?'Close menu':'Open menu');
});
addEventListener('keydown', e=>{ if(e.key==='Escape') closeMenu(); });

addEventListener('hashchange', go);
go();
})();

</script>
