<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"></head><body>
<title>Tareq Mahmud</title>
<meta name="description" content="Tareq Mahmud, Mid-Senior UI/UX and Product Designer in Dhaka. Product design for ecommerce, logistics, ERP, payments and SaaS.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* ============ Tokens (carried over from the Soniq system) ============ */
:root{
  color-scheme: light;
  --ink:#14160e;        /* olive near-black: dark sections */
  --ink-2:#1d2016;      /* dark card */
  --ink-3:#282c20;      /* dark card, raised */
  --paper:#f4f4ee;      /* cream ground */
  --paper-2:#e7e9da;    /* sage panel */
  --card:#fbfbf7;       /* light card */
  --text:#15170f;
  --muted:#65685b;
  --muted-d:#a2a596;    /* muted text on dark */
  --line:rgba(21,23,15,.12);
  --line-d:rgba(244,244,238,.13);
  --lime:#b9e25b;
  --lime-2:#a6d23f;
  --lime-ink:#18200a;

  --f-sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono:"Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --t-hero:clamp(2.55rem, 1.1rem + 5.4vw, 5.9rem);
  --t-h2:clamp(2rem, 1.25rem + 2.5vw, 3.35rem);
  --t-h3:clamp(1.3rem, 1.1rem + .7vw, 1.7rem);
  --t-lead:clamp(1.12rem, .98rem + .55vw, 1.42rem);
  --t-body:1rem;
  --t-small:.875rem;
  --t-meta:.72rem;

  --r-lg:16px; --r-md:12px; --r-pill:999px;
  --gutter:clamp(16px, 4.2vw, 56px);
  --max:1320px;
  --col-gap:clamp(16px, 2vw, 28px);
  --sec:clamp(72px, 9vw, 140px);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--f-sans);font-size:var(--t-body);line-height:1.6;font-weight:400;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:400;text-wrap:balance}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--lime-2);outline-offset:3px;border-radius:6px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;left:16px;top:-60px;z-index:100;background:var(--lime);color:var(--lime-ink);padding:10px 16px;border-radius:var(--r-pill);text-decoration:none;font-weight:500}
.skip:focus{top:calc(12px + env(safe-area-inset-top,0px))}

.wrap{max-width:var(--max);margin-inline:auto;padding-inline:var(--gutter)}
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--col-gap)}
.dark{background:var(--ink);color:var(--paper)}
.meta{font-family:var(--f-mono);font-size:var(--t-meta);letter-spacing:.07em;text-transform:uppercase}
.muted{color:var(--muted)}
.dark .muted{color:var(--muted-d)}
.h2{font-size:var(--t-h2);line-height:1.07;letter-spacing:-.032em}
.h3{font-size:var(--t-h3);line-height:1.2;letter-spacing:-.02em}
.lead{font-size:var(--t-lead);line-height:1.45;letter-spacing:-.012em}
.tnum{font-variant-numeric:tabular-nums}

/* ============ Buttons (Soniq pills) ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55em;height:48px;padding-inline:24px;border-radius:var(--r-pill);border:1px solid transparent;text-decoration:none;font-size:.95rem;font-weight:500;letter-spacing:-.005em;cursor:pointer;white-space:nowrap;transition:transform .25s var(--ease), background-color .25s, color .25s, border-color .25s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-lime{background:var(--lime);color:var(--lime-ink)}
.btn-lime:hover{background:#c7ec6e}
.btn-ink{background:var(--ink);color:var(--paper)}
.btn-ink:hover{background:#262a1d}
.btn-white{background:#fff;color:var(--ink)}
.btn-ghost{background:rgba(244,244,238,.08);color:var(--paper);border-color:var(--line-d);backdrop-filter:blur(10px)}
.btn-ghost:hover{background:rgba(244,244,238,.16)}
.btn-line{background:transparent;color:var(--text);border-color:var(--line)}
.btn-line:hover{border-color:var(--text)}
.btn .ri{font-size:16px;line-height:1;flex:none}
.arrow-link{display:inline-flex;align-items:center;gap:.45em;text-decoration:none;font-weight:500;font-size:.95rem}
.arrow-link .ri{font-size:16px;line-height:1;transition:transform .25s var(--ease)}
.arrow-link:hover .ri{transform:translateX(3px)}

/* ============ Nav (Soniq frosted pill, compresses on scroll) ============ */
.nav{position:fixed;left:0;right:0;top:0;z-index:50;padding-top:calc(18px + env(safe-area-inset-top,0px));transition:padding .35s var(--ease);pointer-events:none}
.nav-bar{pointer-events:auto;max-width:1000px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 7px 7px 16px;border-radius:var(--r-pill);background:rgba(28,31,22,.55);border:1px solid rgba(244,244,238,.1);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);color:var(--paper);transition:background-color .35s, box-shadow .35s, max-width .35s var(--ease)}
.nav-wrap{padding-inline:var(--gutter)}
.nav.compact{padding-top:calc(10px + env(safe-area-inset-top,0px))}
.nav.compact .nav-bar{background:rgba(20,22,14,.86);box-shadow:0 8px 30px rgba(10,12,6,.18);max-width:920px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:500;letter-spacing:-.01em;white-space:nowrap}
.brand-logo{display:block;width:22px;height:22px;object-fit:contain;flex:none}
.nav-links{display:flex;gap:4px}
.nav-links a{padding:8px 14px;border-radius:var(--r-pill);text-decoration:none;font-size:.9rem;color:rgba(244,244,238,.82);transition:background-color .2s,color .2s}
.nav-links a:hover,.nav-links a[aria-current="true"]{background:rgba(244,244,238,.1);color:var(--paper)}
.nav-cta{display:flex;align-items:center;gap:6px}
.nav .btn{height:40px;padding-inline:18px;font-size:.88rem}
.menu-btn{display:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line-d);background:transparent;cursor:pointer;align-items:center;justify-content:center}
.menu-btn span{display:block;width:16px;height:1.5px;background:var(--paper);position:relative}
.menu-btn span::before,.menu-btn span::after{content:"";position:absolute;left:0;width:16px;height:1.5px;background:var(--paper);transition:transform .25s}
.menu-btn span::before{top:-5px}.menu-btn span::after{top:5px}
.menu-open .menu-btn span{background:transparent}
.menu-open .menu-btn span::before{transform:translateY(5px) rotate(45deg)}
.menu-open .menu-btn span::after{transform:translateY(-5px) rotate(-45deg)}
.sheet{display:none}

/* ============ Hero ============ */
.hero{position:relative;background:var(--ink);color:var(--paper);overflow:hidden;isolation:isolate}
.hero-media{position:absolute;inset:0;z-index:-2;overflow:hidden;background:radial-gradient(80% 70% at 68% 105%, #2c3316 0%, #151809 45%, #050604 80%)}
.hero-media video{position:absolute;left:0;top:-8%;width:100%;height:116%;object-fit:cover;object-position:center;display:block}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:
  linear-gradient(180deg, rgba(10,12,6,.35) 0%, rgba(10,12,6,0) 30%, rgba(20,22,14,0) 62%, rgba(20,22,14,.75) 88%, var(--ink) 100%),
  linear-gradient(90deg, rgba(10,12,6,.78) 0%, rgba(10,12,6,.55) 36%, rgba(10,12,6,.12) 62%, rgba(10,12,6,0) 80%)}
@media (max-width:860px){
  .hero::before{background:
    linear-gradient(180deg, rgba(10,12,6,.6) 0%, rgba(10,12,6,.62) 45%, rgba(20,22,14,.9) 72%, var(--ink) 100%)}
}
.hero-inner{padding-top:calc(170px + env(safe-area-inset-top,0px));padding-bottom:clamp(104px,10vw,144px)}
.hero-eyebrow{display:flex;align-items:center;gap:10px;color:var(--muted-d);margin-bottom:28px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px rgba(185,226,91,.18)}
.hero h1{font-size:var(--t-hero);line-height:1.01;letter-spacing:-.045em;font-weight:400;max-width:17ch}
.hero h1 em{font-style:normal;color:var(--lime)}
.hero-sub{margin-top:28px;max-width:40ch;color:rgba(244,244,238,.72)}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:36px}
.cred{margin-top:clamp(56px,7vw,96px);border-top:1px solid var(--line-d);display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.cred li{padding:20px 20px 4px 0;display:flex;flex-direction:column;gap:6px}
.cred li + li{padding-left:20px;border-left:1px solid var(--line-d)}
.cred b{font-weight:400;font-size:1.05rem;letter-spacing:-.01em}
.cred span{color:var(--muted-d);font-size:var(--t-small)}

/* Product strip (was the Soniq logo marquee) */
.strip{border-top:0;padding-block:26px;overflow:hidden;position:relative}
.strip-label{color:var(--muted-d);margin-bottom:16px;text-align:center}
.marquee{display:flex;align-items:center;width:max-content;animation:marq 60s linear infinite}
.strip:hover .marquee{animation-play-state:paused}
.marquee .logo{flex:none;display:flex;align-items:center;justify-content:center;height:56px;padding-inline:clamp(28px,3.4vw,48px)}
.marquee .logo img{width:auto;max-width:none;opacity:.62;filter:saturate(.75);transition:opacity .3s, filter .3s}
.marquee .logo:hover img{opacity:1;filter:none}
@media (max-width:560px){.marquee .logo{height:44px;padding-inline:22px}.marquee .logo img{transform:scale(.8)}}
.strip::before,.strip::after{content:"";position:absolute;top:0;bottom:0;width:80px;z-index:1;pointer-events:none}
.strip::before{left:0;background:linear-gradient(90deg,var(--ink),transparent)}
.strip::after{right:0;background:linear-gradient(-90deg,var(--ink),transparent)}
@keyframes marq{to{transform:translateX(-25%)}}

/* ============ Intro statement + cards (Soniq stat row, made honest) ============ */
.intro{padding-block:clamp(64px,8vw,120px) clamp(56px,7vw,100px)}
.statement{font-size:clamp(1.55rem,1.05rem + 1.9vw,2.6rem);line-height:1.18;letter-spacing:-.028em;max-width:30ch}
.statement span{color:var(--muted-d)}
.facts{margin-top:clamp(48px,6vw,80px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.fact{border-radius:20px;padding:28px;min-height:340px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;background:var(--ink-2)}
.fact.light{background:var(--paper);color:var(--text)}
.fact.photo{position:relative;overflow:hidden;isolation:isolate;justify-content:flex-end;color:#fff}
.fact.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 18%;z-index:-2;transition:transform 1.2s var(--ease)}
.fact.photo:hover img{transform:scale(1.04)}
.fact.photo::after{content:"";position:absolute;inset:0;z-index:-1;background:none}
.fav{display:flex;align-items:center}
.fav span{width:52px;height:52px;border-radius:50%;background:var(--ink);border:3px solid var(--paper);display:grid;place-items:center;overflow:hidden;margin-left:-12px}
.fav span:first-child{margin-left:0}
.fav img{width:58%;height:58%;object-fit:contain}
.fav i{font-style:normal;width:52px;height:52px;font-size:1.5rem!important;border-width:3px!important;border-radius:50%;background:var(--lime);color:var(--lime-ink)!important;color:var(--paper);display:grid;place-items:center;margin-left:-12px;border:3px solid var(--paper)}
.fact.light .v{font-size:1.3rem;letter-spacing:-.02em;margin-bottom:12px}
.fact.light .k{font-size:.95rem;line-height:1.45}
.fl{display:flex;align-items:center;gap:10px;font-size:1.05rem;color:var(--paper)}
.fdot{width:22px;height:22px;border-radius:50%;background:var(--lime);position:relative;flex:none}
.fdot::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--ink);left:5px;top:4px}
.fact .v{font-size:clamp(3rem,2rem + 3vw,4.6rem)}
.fc{color:var(--muted-d);font-size:.9rem;margin-top:10px}
.fact.photo{padding:0}
.fact .k{font-size:var(--t-small);color:var(--muted-d)}
.fact.light .k{color:var(--muted)}
.fact .v{font-size:clamp(2.2rem,1.6rem + 1.8vw,3.4rem);line-height:1;letter-spacing:-.04em}
.fact.light .v{font-size:1.2rem;letter-spacing:-.015em;line-height:1.3}
.fact .dot{width:22px;height:22px;border-radius:50%;background:var(--ink);position:relative}
.fact .dot::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--lime)}

/* ============ Section header pattern (Soniq: title left, caption right) ============ */
.sec{padding-block:var(--sec)}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:32px 48px;flex-wrap:wrap;margin-bottom:clamp(40px,5vw,64px)}
.sec-head .h2{max-width:16ch}
.sec-head p{max-width:34ch;color:var(--muted);font-size:.95rem}
.dark .sec-head p{color:var(--muted-d)}
.eyebrow{display:block;margin-bottom:18px;color:var(--muted)}
.dark .eyebrow{color:var(--muted-d)}

/* ============ Featured work ============ */
.featured{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.feat{position:relative;border-radius:var(--r-lg);overflow:hidden;text-decoration:none;color:inherit;display:grid;isolation:isolate}
.feat.wide{grid-column:1 / -1;grid-template-columns:minmax(0,5fr) minmax(0,7fr);min-height:560px}
.feat.half{grid-template-rows:auto 1fr}
.feat.sage{background:var(--paper-2)}
.feat.inkc{background:var(--ink);color:var(--paper)}
.feat.limec{background:var(--lime);color:var(--lime-ink)}
.feat.cardc{background:var(--card);border:1px solid var(--line)}
.feat-body{padding:clamp(24px,3vw,44px);display:flex;flex-direction:column;gap:18px;justify-content:space-between;position:relative;z-index:1}
.feat-top{display:flex;flex-direction:column;gap:16px}
.feat-index{display:flex;justify-content:space-between;gap:12px;opacity:.7}
.feat h3{font-size:clamp(1.7rem,1.25rem + 1.5vw,2.6rem);line-height:1.05;letter-spacing:-.035em}
.feat .cat{opacity:.75}
.feat p.desc{max-width:40ch;opacity:.82}
.feat-meta{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:var(--t-small);border-top:1px solid currentColor;border-color:color-mix(in srgb, currentColor 16%, transparent);padding-top:16px}
.feat-meta dt{opacity:.6}
.feat-meta dd{margin:0}
.feat-cta{display:inline-flex;align-items:center;gap:10px;font-weight:500}
.feat-cta-icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--paper);transition:transform .35s var(--ease);flex:none}
.feat-cta-icon .ri{display:inline-block;font-size:16px;line-height:1;color:inherit!important;-webkit-text-fill-color:currentColor}
.feat.inkc .feat-cta-icon{background:var(--lime);color:var(--lime-ink)}
.feat.limec .feat-cta-icon{background:var(--ink);color:var(--lime)}
.feat:hover .feat-cta-icon{transform:translateX(4px)}
.feat-art{position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.phones{display:flex;gap:14px;align-items:flex-end;padding:40px 32px 0;width:100%;justify-content:center}
.phone{flex:0 1 210px;border-radius:22px 22px 0 0;overflow:hidden;box-shadow:0 24px 60px rgba(20,22,14,.2);transition:transform .6s var(--ease)}
.phone img{width:100%;height:auto;aspect-ratio:450/800;object-fit:cover;object-position:top}
.phone:nth-child(2){transform:translateY(-36px)}
.feat:hover .phone{transform:translateY(-8px)}
.feat:hover .phone:nth-child(2){transform:translateY(-44px)}
.shot{border-radius:12px 12px 0 0;overflow:hidden;box-shadow:0 24px 60px rgba(20,22,14,.22);margin:36px 0 0 36px;transition:transform .6s var(--ease)}
.feat:hover .shot{transform:translateY(-6px) scale(1.01)}
.shot img{width:100%;height:auto}
.feat-art:has(.mock){align-items:center}
.mock{width:100%;height:100%;display:flex;justify-content:center;align-items:center;padding:clamp(28px,3.5vw,52px)}
.mock img{width:100%;max-width:560px;height:auto;filter:drop-shadow(0 28px 36px rgba(20,22,14,.18)) drop-shadow(0 6px 10px rgba(20,22,14,.08));transition:transform .7s var(--ease)}
.feat:hover .mock img{transform:translateY(-8px)}
.feat.inkc .mock{background:radial-gradient(55% 50% at 50% 55%, rgba(185,226,91,.14), transparent 70%)}
.feat.inkc .mock img{filter:drop-shadow(0 30px 50px rgba(0,0,0,.45))}
.cover-mock{justify-content:center;align-items:center;padding:clamp(28px,4vw,64px)!important}
.cover-mock img{width:100%;max-width:680px;height:auto;filter:drop-shadow(0 30px 40px rgba(20,22,14,.18))}
@media (max-width:1080px){.mock img{max-width:520px}}
@media (max-width:560px){.mock{padding:8px 20px 28px}.cover-mock{overflow:visible}}
.feat.half{display:flex;flex-direction:column}
.feat.half .feat-body{flex:1 1 auto;justify-content:flex-start}
.feat.half .feat-body > div:last-child{margin-top:auto}
.feat.half h3{min-height:2.1em}
.feat.half p.desc{min-height:4.8em}
.feat.half .feat-art{flex:none;display:block;padding:0 clamp(24px,3vw,44px) clamp(24px,3vw,44px)}
.feat.half .shot{margin:0;width:100%;aspect-ratio:16/10;border-radius:12px;border:1px solid var(--line);box-shadow:none;overflow:hidden;background:var(--card)}
.feat.half .shot img{width:100%;height:100%;object-fit:cover;object-position:left top}
.feat.half:hover .shot{transform:translateY(-4px)}
@media (max-width:860px){.feat.half h3,.feat.half p.desc{min-height:0}}
.caption-chip{position:absolute;left:16px;top:16px;z-index:2;background:rgba(20,22,14,.72);color:var(--paper);padding:6px 10px;border-radius:var(--r-pill);backdrop-filter:blur(8px)}

/* Role map (payment gateway, no UI available) */
.rolemap{padding:8px clamp(24px,3vw,44px) clamp(24px,3vw,44px);display:flex;flex-direction:column;gap:10px}
.rm-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rm-node{background:rgba(24,32,10,.07);border:1px solid rgba(24,32,10,.16);border-radius:var(--r-md);padding:14px 12px;display:flex;flex-direction:column;gap:6px;min-height:118px}
.rm-node b{font-weight:500;font-size:.95rem;letter-spacing:-.01em}
.rm-node span{font-size:.8rem;opacity:.72;line-height:1.4}
.rm-bus{border:1px dashed rgba(24,32,10,.35);border-radius:var(--r-md);padding:10px 12px;text-align:center;font-size:.82rem}
.rm-flow{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:.78rem;flex-wrap:wrap}
.rm-flow span{padding:6px 10px;border-radius:var(--r-pill);background:var(--lime-ink);color:var(--lime);white-space:nowrap}
.rm-flow i{flex:1;height:1px;background:rgba(24,32,10,.3);min-width:10px}

/* ============ More work list ============ */
.more{margin-top:clamp(72px,8vw,112px)}
.more-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px 48px;flex-wrap:wrap;padding-top:clamp(40px,5vw,64px);border-top:1px solid var(--line);margin-bottom:clamp(32px,4vw,52px)}
.more-head .h2{max-width:20ch;margin:0}
.more-head .muted-h{color:var(--muted)}
.more-head p{max-width:34ch;color:var(--muted);font-size:.95rem}
.mw-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.mw{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;aspect-ratio:4/5;border-radius:var(--r-lg);text-decoration:none;color:var(--text);
  background:radial-gradient(90% 70% at 100% 0%, color-mix(in srgb, var(--tint) 85%, white) 0%, transparent 60%),
             radial-gradient(80% 60% at 0% 100%, color-mix(in srgb, var(--tint) 60%, white) 0%, transparent 70%),

.cap-tab.on b{color:var(--text)}
.cap-tab-icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);opacity:0;transform:translateX(-8px);transition:opacity .4s,transform .5s cubic-bezier(.22,.8,.2,1),background-color .3s}
.cap-tab-icon .ri{font-size:15px;line-height:1}
.cap-tab.on .cap-tab-icon{opacity:1;transform:none;background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.cap-tab:focus-visible b{outline:2px solid var(--lime-2);outline-offset:4px;border-radius:6px}
.cap-stage{position:relative;background:var(--ink);color:var(--paper);border-radius:20px;padding:clamp(24px,3vw,40px);overflow:hidden;isolation:isolate;height:560px;display:flex;flex-direction:column}
.cap-panel.on{flex:1}
.cap-stage{background:#1b2512}
.cap-stage::before{content:"";position:absolute;inset:-20px;z-index:-2;background:url(img/cap-grass.webp) center/cover no-repeat;transform:scale(1.04);transition:transform 1.4s var(--ease)}
.cap-stage::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,14,6,.62) 0%,rgba(10,14,6,.35) 45%,rgba(10,14,6,.7) 100%)}
.cap-wrap:hover .cap-stage::before{transform:scale(1.08)}
.cap-skills li{background:rgba(255,255,255,.12)!important;border-color:rgba(255,255,255,.22)!important;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

.cap-panel{display:flex;flex-direction:column;gap:22px;height:100%}

.cap-panel.on{animation:capIn .6s cubic-bezier(.22,.8,.2,1) both}
@keyframes capIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.cap-desc{font-size:clamp(1.2rem,1rem + .7vw,1.55rem);line-height:1.3;letter-spacing:-.02em;max-width:30ch}
.cap-skills{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}

.cap-skills li:nth-child(1){animation-delay:.08s}.cap-skills li:nth-child(2){animation-delay:.13s}.cap-skills li:nth-child(3){animation-delay:.18s}.cap-skills li:nth-child(4){animation-delay:.23s}.cap-skills li:nth-child(5){animation-delay:.28s}.cap-skills li:nth-child(6){animation-delay:.33s}
.cap-seen{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.cap-seen .meta{color:var(--muted-d)}
.cap-thumbs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cap-thumb{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--paper)}

.cap-thumb-img img{width:100%;height:100%;object-fit:cover;object-position:left top;transition:transform .8s var(--ease)}
.cap-thumb:hover img{transform:scale(1.05)}

.cap-thumb:hover .cap-thumb-l em{transform:translate(2px,-2px);opacity:1}
@media (max-width:900px){.cap-wrap{grid-template-columns:1fr}.cap-stage{height:auto}.cap-tabs{height:auto}.cap-tab{flex:none}}

@media (prefers-reduced-motion: reduce){.cap-panel.on,.cap-panel.on .cap-skills li{animation:none}}

/* ============ Button hover (CSS only) ============ */
.btn{position:relative;isolation:isolate;overflow:hidden;transition:transform .35s cubic-bezier(.22,.8,.2,1),color .35s,border-color .35s,box-shadow .35s}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;transform:scaleX(0);transform-origin:left center;transition:transform .45s cubic-bezier(.22,.8,.2,1)}
.btn:hover::before{transform:scaleX(1)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn-lime::before{background:var(--ink)}
.btn-lime:hover{color:var(--lime)}
.btn-lime:hover{background:var(--lime);box-shadow:0 12px 26px -12px rgba(20,22,14,.55)}
.btn-ink::before{background:var(--lime)}
.btn-ink:hover{color:var(--lime-ink);background:var(--ink)}
.btn-white::before{background:var(--lime)}
.btn-white:hover{color:var(--lime-ink)}
.btn-ghost::before{background:var(--paper)}
.btn-ghost:hover{color:var(--ink);border-color:var(--paper);background:rgba(244,244,238,.08)}
.btn-line::before{background:var(--ink)}
.btn-line:hover{color:var(--paper);border-color:var(--ink)}
.btn .ri{transition:transform .4s cubic-bezier(.22,.8,.2,1)}
.btn:hover .ri{transform:translateX(4px)}
.btn[href$=".pdf"]:hover .ri-download-line{transform:translateY(3px)}

.pg-clean-end .pg-clean-label{color:var(--muted-d)}
.pg-clean-end h2{font-size:clamp(1.8rem,1.2rem + 2vw,3rem);line-height:1.08;letter-spacing:-.04em;font-weight:400;max-width:22ch;margin:18px 0}
.pg-clean-end p{color:var(--muted-d);line-height:1.65;max-width:62ch}
.pg-clean-next{display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--line-d);margin-top:38px;padding-top:20px}
.pg-clean-next a{color:var(--paper);text-decoration:none;display:flex;flex-direction:column;gap:7px}.pg-clean-next a:last-child{text-align:right}.pg-clean-next .meta{color:var(--muted-d)}
@media(max-width:900px){.pg-clean-intro{grid-template-columns:1fr;gap:24px}.pg-clean-steps{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:28px}.pg-clean-step img{height:clamp(260px,48vw,420px)}.pg-clean-heading{grid-template-columns:1fr;gap:12px}}
@media(max-width:560px){.pg-clean-hero{padding-top:96px}.pg-clean-meta{grid-template-columns:1fr 1fr;gap:18px}.pg-clean-meta div:last-child{grid-column:1/-1}.pg-clean-cover{padding:12px;gap:10px;border-radius:12px}.pg-clean-cover figure{border-radius:8px}.pg-clean-cover figure:first-child{transform:translateY(10px)}.pg-clean-cover figure:last-child{transform:translateY(-10px)}.pg-clean-section{padding-block:56px}.pg-clean-columns{grid-template-columns:1fr}.pg-clean-steps{grid-template-columns:repeat(5,minmax(210px,72vw));overflow-x:auto;padding:0 0 14px;scroll-snap-type:x mandatory}.pg-clean-step{scroll-snap-align:start}.pg-clean-step img{height:390px}.pg-clean-merchant-caption{display:block}.pg-clean-merchant-caption span{display:block;margin-top:6px}.pg-clean-end{padding:26px 22px}.pg-clean-next{font-size:.84rem}}
/* ============ Experience (Soniq FAQ panel style) ============ */
.exp{position:relative;overflow:hidden;isolation:isolate}
.exp::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(55% 60% at 85% 10%, rgba(185,226,91,.1), transparent 70%)}
.exp-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:var(--col-gap)}
.exp-left{display:flex;flex-direction:column;gap:24px;align-items:flex-start;position:sticky;top:120px;align-self:start}
.exp-left p{color:var(--muted-d);max-width:36ch}
.roles{display:flex;flex-direction:column;gap:12px}
.role{border-radius:var(--r-lg);background:rgba(244,244,238,.05);border:1px solid var(--line-d);backdrop-filter:blur(8px)}
.role-head{display:grid;grid-template-columns:1fr auto;gap:6px 16px;padding:22px 24px 0}
.role-head h3{font-size:1.4rem;letter-spacing:-.02em}
.role-head .when{color:var(--muted-d);text-align:right}
.role-head .title{color:var(--lime)}
.role-head .where{color:var(--muted-d);text-align:right;font-size:var(--t-small)}
.role-body{padding:18px 24px 24px;display:flex;flex-direction:column;gap:18px}
.role-body p{color:rgba(244,244,238,.78);max-width:56ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-pill);border:1px solid var(--line-d);font-size:.84rem;color:rgba(244,244,238,.9);text-decoration:none;transition:background-color .2s,border-color .2s}
a.chip:hover{background:rgba(244,244,238,.08);border-color:rgba(244,244,238,.3)}
a.chip::after{content:"↗";font-size:.75em;opacity:.6}
.timeline-rail{display:flex;align-items:center;gap:10px;color:var(--muted-d)}
.timeline-rail i{flex:1;height:1px;background:var(--line-d)}

/* ============ Capabilities ============ */
.caps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.cap{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;display:flex;flex-direction:column;gap:28px;min-height:280px}
.cap:first-child{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cap h3{font-size:1.15rem;letter-spacing:-.015em;display:flex;justify-content:space-between;gap:8px}
.cap h3 .meta{opacity:.55;font-size:.68rem;padding-top:6px}
.cap ul{display:flex;flex-direction:column;gap:0;margin-top:auto}
.cap li{padding:9px 0;border-top:1px solid var(--line);font-size:.95rem}
.cap:first-child li{border-color:var(--line-d)}

/* ============ About ============ */
.about-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:var(--col-gap);align-items:start}
.about-text{display:flex;flex-direction:column;gap:22px}
.about-text .lead{max-width:30ch}
.about-text p.body{max-width:58ch;color:rgba(244,244,238,.74)}
.facts-card{background:var(--paper);color:var(--text);border-radius:var(--r-lg);padding:8px 24px}
.facts-card dl{margin:0}
.facts-card .fr{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:16px 0;border-top:1px solid var(--line)}
.facts-card .fr:first-child{border-top:0}
.facts-card dt{color:var(--muted);font-size:var(--t-small)}
.facts-card dd{margin:0;font-size:.95rem;line-height:1.45}
.facts-card dd small{display:block;color:var(--muted);font-size:.82rem}
.about-cards{display:flex;flex-direction:column;gap:12px}
.quote-card{background:var(--ink-3);border-radius:var(--r-lg);padding:24px;display:flex;flex-direction:column;gap:14px}
.quote-card p{font-size:1.15rem;line-height:1.4;letter-spacing:-.015em}

/* ============ Contact + footer (editorial, cream + wordmark over the product wall) ============ */
.contact{position:relative;overflow:hidden;isolation:isolate;background:var(--paper);color:var(--text)}
.contact::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(rgba(21,23,15,.13) 1px, transparent 1.2px);background-size:22px 22px;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 55%,transparent 80%);mask-image:linear-gradient(180deg,#000 0%,#000 55%,transparent 80%)}
.c-top{padding-top:clamp(72px,9vw,128px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:28px;border-top:1px solid var(--line)}
.contact .section-rule{height:1px;background:var(--line)}
.c-top h2{font-size:clamp(2rem,1.2rem + 3vw,3.9rem);line-height:1.04;letter-spacing:-.04em;font-weight:300;max-width:18ch}
.c-top h2 span{color:var(--muted)}
.c-actions{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px}
.email-pill{display:flex;align-items:center;gap:6px;height:48px;padding:4px 4px 4px 20px;border-radius:var(--r-pill);background:var(--card);border:1px solid var(--line);box-shadow:0 1px 0 rgba(21,23,15,.04)}
.email{font-size:1rem;letter-spacing:-.01em;text-decoration:none;word-break:break-all;user-select:all;padding-right:8px}
.copy{height:40px;padding-inline:16px;border-radius:var(--r-pill);background:var(--ink);color:var(--paper);border:0;cursor:pointer;font-size:.85rem;font-weight:500;white-space:nowrap}
.copy{transition:background-color .3s,color .3s,transform .3s}
.copy:hover,.copy:focus-visible{background:var(--lime);color:var(--lime-ink);transform:translateY(-1px)}

.c-sign{margin-top:clamp(88px,11vw,160px);display:flex;justify-content:space-between;align-items:flex-end;gap:12px 32px;flex-wrap:wrap}
.c-sign b{font-weight:500;font-size:clamp(2.2rem,1.4rem + 3vw,4rem);line-height:.95;letter-spacing:-.05em}
.c-sign b i{font-style:normal;color:var(--lime-2)}
.c-sign p{font-size:clamp(1.1rem,.95rem + .7vw,1.6rem);font-weight:300;letter-spacing:-.025em;color:var(--muted);padding-bottom:4px}
.c-bar{margin-top:18px;border-top:1.5px solid var(--ink);padding-top:18px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px}
 .c-bar{position:relative;z-index:1;background:var(--paper)}
.c-social{display:flex;gap:8px}
.c-social a{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;text-decoration:none;transition:background-color .25s,color .25s,transform .3s var(--ease)}
.c-social a .ri{font-size:18px;line-height:1}
.c-social a:hover{background:var(--lime);color:var(--lime-ink);transform:translateY(-2px)}
.c-links{display:flex;gap:clamp(20px,3.4vw,48px);flex-wrap:wrap;justify-content:center;align-items:center;min-height:44px}
.c-links a{text-decoration:none;font-size:1.02rem;font-weight:500;letter-spacing:-.01em;color:var(--text);display:inline-flex;gap:6px;align-items:center;position:relative}
.c-links a::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1.5px;background:var(--text);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.c-links a:hover::after{transform:scaleX(1)}
.c-links a span{font-size:.9em;color:var(--muted)}
.c-legal{justify-self:end;text-align:right;color:var(--text);font-size:.92rem;line-height:1.5;display:flex;flex-direction:column;justify-content:center;min-height:44px}
.c-legal span{color:var(--muted);font-size:.85rem}
.c-mark{--wm:min(29vw,27rem);position:relative;margin-top:clamp(8px,2vw,24px);height:calc(var(--wm) * .86);overflow:hidden;isolation:isolate}
.c-mark-media{position:absolute;inset:0;z-index:-1;
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.6) 20%,#000 42%);mask-image:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.6) 20%,#000 42%)}
.c-mark-media img{width:100%;height:100%;object-fit:cover;object-position:center 72%}
.c-mark-media::after{content:"";position:absolute;inset:0;background:
  radial-gradient(38% 60% at 4% 18%, rgba(185,226,91,.45), transparent 70%),
  radial-gradient(38% 60% at 97% 12%, rgba(140,200,190,.45), transparent 70%),
  linear-gradient(180deg, rgba(244,244,238,.25), rgba(244,244,238,0) 45%)}
.c-word{position:absolute;left:0;right:0;bottom:0;text-align:center;font-weight:500;font-size:var(--wm);line-height:.8;letter-spacing:-.055em;color:var(--ink);white-space:nowrap;user-select:none;transform:translateY(7%)}
@media (max-width:860px){
  .c-bar{grid-template-columns:1fr;gap:14px}
  .c-links{justify-content:flex-start;padding-top:0}
  .c-legal{justify-self:start;text-align:left;padding-top:0}
  .c-sign{flex-direction:column;align-items:flex-start;gap:8px}
}
@media (max-width:560px){
  .email-pill{width:100%;justify-content:space-between;padding-left:18px}
  .email{font-size:.92rem}
  .c-actions{width:100%}
  .c-actions .btn{width:100%;justify-content:center}
}

/* ============ Case study ============ */
.cs-hero{background:var(--ink);color:var(--paper);position:relative;overflow:hidden;isolation:isolate}
.cs-hero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(60% 70% at 80% 0%, rgba(185,226,91,.13), transparent 70%),linear-gradient(180deg,#22261a, var(--ink) 70%)}
.cs-hero-inner{padding-top:calc(140px + env(safe-area-inset-top,0px));padding-bottom:clamp(48px,6vw,80px)}
.crumbs{display:flex;align-items:center;gap:10px;color:var(--muted-d);margin-bottom:28px}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--paper)}
.cs-hero h1{font-size:clamp(2.4rem,1.2rem + 4.4vw,5rem);line-height:1.02;letter-spacing:-.045em;max-width:17ch}
.cs-hero .lead{margin-top:24px;max-width:46ch;color:rgba(244,244,238,.75)}
.cs-meta{margin-top:clamp(40px,5vw,64px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line-d)}
.cs-meta div{padding:18px 18px 0 0;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.cs-meta div + div{padding-left:18px;border-left:1px solid var(--line-d)}
.cs-meta span{color:var(--muted-d)}
.cs-meta a{color:var(--lime)}
.cs-cover{background:linear-gradient(180deg,var(--ink) 0 38%, var(--paper) 38%)}
.cover-frame{border-radius:var(--r-lg);overflow:hidden;background:var(--paper-2);padding:clamp(20px,4vw,56px) clamp(20px,4vw,56px) 0;display:flex;gap:clamp(10px,1.6vw,20px);justify-content:center;align-items:flex-end}
.cover-frame .phone{flex:0 1 240px;box-shadow:0 30px 70px rgba(20,22,14,.18)}
.cover-frame .phone:nth-child(2){transform:translateY(-28px)}
.cover-frame .shot{margin:0;flex:1;max-width:900px}
.cover-frame .shot img{width:100%;height:auto}
.cs-body{padding-block:clamp(56px,7vw,110px)}
.cs-layout{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:var(--col-gap)}
.toc{position:sticky;top:110px;align-self:start;display:flex;flex-direction:column;gap:2px}
.toc a{display:grid;grid-template-columns:34px 1fr;padding:7px 0;text-decoration:none;font-size:.9rem;color:var(--muted);transition:color .2s}
.toc a .meta{padding-top:3px}
.toc a:hover,.toc a.on{color:var(--text)}
.toc a.on .meta{color:var(--lime-2)}
.cs-sections{display:flex;flex-direction:column;gap:clamp(64px,7vw,104px)}
.cs-sec{scroll-margin-top:110px;display:flex;flex-direction:column;gap:22px}
.cs-sec > .meta{color:var(--muted);display:flex;gap:12px;align-items:center}
.cs-sec > .meta::after{content:"";flex:1;height:1px;background:var(--line)}
.cs-sec h2{font-size:clamp(1.6rem,1.2rem + 1.4vw,2.4rem);line-height:1.1;letter-spacing:-.03em;max-width:22ch}
.cs-sec p{max-width:62ch;color:#3a3c33}
.cs-sec p.lead{color:var(--text)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:10px}
.box h3{font-size:1.1rem;letter-spacing:-.015em}
.box p{font-size:.95rem;color:var(--muted)}
.box.inkb{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.box.inkb p{color:var(--muted-d)}
.box.sageb{background:var(--paper-2);border-color:transparent}
.box .meta{color:var(--muted)}
.box.inkb .meta{color:var(--lime)}
.problem{background:var(--ink);color:var(--paper);border-radius:var(--r-lg);padding:clamp(24px,3.4vw,48px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
.problem .meta{color:var(--lime)}
.problem p{color:rgba(244,244,238,.86);font-size:var(--t-lead);line-height:1.4;letter-spacing:-.012em;max-width:none}
.focus-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--line)}
.focus-list div{padding:18px 16px 0 0;display:flex;flex-direction:column;gap:6px}
.focus-list div + div{padding-left:16px;border-left:1px solid var(--line)}
.focus-list.f5{grid-template-columns:repeat(5,minmax(0,1fr))}
.focus-list b{font-weight:500}
.focus-list span{font-size:.88rem;color:var(--muted)}
/* scope map */
.scope{background:var(--paper-2);border-radius:var(--r-lg);padding:clamp(16px,2.4vw,28px);display:flex;flex-direction:column;gap:10px}
.scope-root{background:var(--ink);color:var(--paper);border-radius:var(--r-md);padding:14px 16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.scope-root b{font-weight:500}
.scope-root span{color:var(--muted-d);font-size:.85rem}
.scope-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.scope-node{background:var(--card);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:8px}
.scope-node b{font-weight:500;font-size:.95rem}
.scope-node ul{display:flex;flex-direction:column;gap:3px;font-size:.84rem;color:var(--muted)}
.scope-note{font-size:.8rem;color:var(--muted)}
.ia-map{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);overflow:hidden}
.ia-map-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:17px 20px;border-bottom:1px solid var(--line)}
.ia-map-head b{font-size:.95rem;font-weight:500}
.ia-map-head span{font:.68rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.ia-map-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line)}
.ia-map-card{min-width:0;background:var(--card);padding:20px;min-height:142px}
.ia-map-card h3{font-size:1rem;font-weight:500;letter-spacing:-.015em;margin-bottom:12px}
.ia-map-card ul{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:.84rem;line-height:1.4}
.ia-map-foot{padding:12px 20px;border-top:1px solid var(--line);font-size:.78rem;color:var(--muted)}
/* gallery */
.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.gallery.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.gallery figure{margin:0;display:flex;flex-direction:column;gap:10px}
.gallery .frame{border-radius:var(--r-md);overflow:hidden;background:var(--paper-2)}
.gallery img{width:100%;height:auto;transition:transform .6s var(--ease)}
.gallery figure:hover img{transform:scale(1.02)}
.gallery figcaption{font-size:.84rem;color:var(--muted);line-height:1.4}
.gallery figcaption b{display:block;color:var(--text);font-weight:500}
.wide-shot{margin:0;display:flex;flex-direction:column;gap:10px}
.wide-shot .frame{border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line)}
.wide-shot img{width:100%;height:auto}
.wide-shot figcaption{font-size:.84rem;color:var(--muted)}
/* decisions */
.decisions{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.decision{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr) minmax(0,3fr);gap:20px;padding:22px 0;border-bottom:1px solid var(--line);align-items:start}
.decision h3{font-size:1.15rem;letter-spacing:-.015em}
.decision p{font-size:.95rem;color:var(--muted)}
.decision .frame{border-radius:10px;overflow:hidden;background:var(--paper-2)}
.pg-case-problem{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pg-case-problem article{min-height:210px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(18px,2vw,26px);display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.pg-case-index{font: .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pg-case-problem h3{font-size:clamp(1.15rem,1rem + .65vw,1.5rem);line-height:1.22;letter-spacing:-.025em;font-weight:500;max-width:20ch}
.pg-case-problem p{font-size:.9rem;line-height:1.55;color:var(--muted);margin-top:auto}
.pg-case-challenge{display:grid;grid-template-columns:160px 1fr;gap:20px;align-items:start;background:var(--ink);color:var(--paper);border-radius:var(--r-lg);padding:20px 24px;margin-top:10px}
.pg-case-challenge span{font: .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--lime);padding-top:3px}
.pg-case-challenge p{color:rgba(244,244,238,.88);line-height:1.55;max-width:62ch}
.pg-case-roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pg-case-role{position:relative;min-height:218px;padding:22px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);display:flex;flex-direction:column;align-items:flex-start}
.pg-case-role:nth-child(2){background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pg-case-role .pg-case-index{margin-bottom:24px}
.pg-case-role:nth-child(2) .pg-case-index{color:var(--lime)}
.pg-case-role h3{font-size:1.35rem;letter-spacing:-.025em;font-weight:500;margin-bottom:8px}
.pg-case-role b{font-size:.78rem;font-weight:500;color:var(--lime-2);margin-bottom:12px}
.pg-case-role:nth-child(2) b{color:var(--lime)}
.pg-case-role p{font-size:.9rem;color:var(--muted);line-height:1.55}
.pg-case-role:nth-child(2) p{color:var(--muted-d)}
.pg-case-decisions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;counter-reset:caseDecision}
.pg-case-decision{min-height:170px;border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;background:var(--card);display:flex;flex-direction:column;align-items:flex-start;gap:18px}
.pg-case-decision::before{counter-increment:caseDecision;content:"0" counter(caseDecision);font:.72rem var(--f-mono);color:var(--lime-2)}

let swapping = false;
function go(){
  const h = decodeURIComponent(location.hash.slice(1));
  const wantCase = !!CASES[h];
  const target = wantCase ? null : (h || 'top');
  const needSwap = wantCase ? current !== h : current !== 'home';
  const finish = () => {
    if(wantCase){ window.scrollTo({top:0, behavior:'instant'}); focusTitle('cs-title'); }
    else {
      const el = document.getElementById(target);
      if(el && target !== 'top'){ requestAnimationFrame(()=>el.scrollIntoView({behavior: needSwap ? 'instant':'smooth', block:'start'})); }
      else if(needSwap || target==='top'){ window.scrollTo({top:0, behavior: needSwap?'instant':'smooth'}); }
    }
  };
  if(!needSwap){ finish(); return; }
  if(current === null){ mount(wantCase?'case':'home', h); finish(); return; }
  if(swapping) return;
  swapping = true;
  view.classList.add('leaving');
  setTimeout(()=>{ mount(wantCase?'case':'home', h); finish(); requestAnimationFrame(()=>{ view.classList.remove('leaving'); swapping=false; }); }, 220);
}

  const setL=t=>{ const sp=b.querySelectorAll('.bl > span'); if(sp.length){ sp[0].textContent=t; sp[1].textContent=t; } else b.textContent=t; };
  setL('Press ⌘/Ctrl+C');
  setTimeout(()=>setL('Copy'),2400);
}

/* in-page anchors inside a case study scroll without leaving it */
document.addEventListener('click', e=>{
  const a = e.target.closest('a[href^="#"]');
  if(!a) return;
  const id = a.getAttribute('href').slice(1);
  closeMenu();
  if(current !== 'home' && !CASES[id]){
    const el = document.getElementById(id);
    if(el && view.contains(el)){ e.preventDefault(); el.scrollIntoView({behavior:'smooth', block:'start'}); }
  }
});

/* ---------- nav: compress on scroll, section highlight ---------- */
const nav = document.getElementById('nav');
let ticking=false;
addEventListener('scroll', ()=>{ if(ticking) return; ticking=true; requestAnimationFrame(()=>{
  nav.classList.toggle('compact', scrollY > 40);
  if(current==='home'){
    let on=null;
    ['work','why','about','contact'].forEach(id=>{ const el=document.getElementById(id); if(el && el.getBoundingClientRect().top < innerHeight*0.4) on=id; });
    document.querySelectorAll('.nav-links a').forEach(a=>a.setAttribute('aria-current', String(a.getAttribute('href')==='#'+on)));
  } else {
    document.querySelectorAll('.nav-links a').forEach(a=>a.setAttribute('aria-current', String(a.getAttribute('href')==='#work')));
  }
  ticking=false; }); }, {passive:true});

/* ---------- mobile menu ---------- */
const menuBtn = document.getElementById('menuBtn');
function closeMenu(){ document.body.classList.remove('menu-open'); menuBtn.setAttribute('aria-expanded','false'); menuBtn.setAttribute('aria-label','Open menu'); }
menuBtn.addEventListener('click', ()=>{
  const open = !document.body.classList.contains('menu-open');
  document.body.classList.toggle('menu-open', open);
  menuBtn.setAttribute('aria-expanded', String(open));
  menuBtn.setAttribute('aria-label', open?'Close menu':'Open menu');
});
addEventListener('keydown', e=>{ if(e.key==='Escape') closeMenu(); });

addEventListener('hashchange', go);
go();
})();
